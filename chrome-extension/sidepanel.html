<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RACK 상품 리서치</title>
  <!-- 확장 페이지는 인라인 스크립트를 못 쓴다(MV3 보안 정책) — 스크립트는 아래 파일로만. -->
  <style>
    html, body { margin: 0; height: 100%; background: #f6f6f4; color: #1c1a17;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f6f6f4; }
    .state { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; padding: 24px; text-align: center; background: #f6f6f4; z-index: 2; }
    .state[hidden] { display: none; }
    .state p { margin: 0; max-width: 300px; }
    .state small { color: #7a756c; }
    .spin { width: 22px; height: 22px; border: 3px solid #e4e2dd; border-top-color: #2f6df6;
      border-radius: 50%; animation: s 0.8s linear infinite; }
    .state.err .spin { display: none; }
    @keyframes s { to { transform: rotate(360deg); } }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    button { padding: 9px 14px; border-radius: 8px; border: 1px solid #2f6df6; background: #2f6df6;
      color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button.ghost { background: transparent; color: #7a756c; border-color: #e4e2dd; font-weight: 500; }
    button[hidden] { display: none; }
    @media (prefers-color-scheme: dark) {
      html, body, .state, iframe { background: #171614; color: #ece9e3; }
      .state small { color: #918b81; }
      .spin { border-color: #33312c; border-top-color: #6d97ff; }
      button.ghost { color: #918b81; border-color: #33312c; }
    }
  </style>
</head>
<body>
  <iframe id="app" title="RACK 상품 리서치"></iframe>
  <div class="state" id="state">
    <div class="spin"></div>
    <p id="stateText">리서치 앱을 여는 중…</p>
    <small id="stateSub"></small>
    <div class="btns">
      <button id="openTab" hidden>새 탭에서 열기</button>
      <button id="stayHere" class="ghost" hidden>그래도 여기서 보기</button>
    </div>
  </div>
  <script src="research.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
