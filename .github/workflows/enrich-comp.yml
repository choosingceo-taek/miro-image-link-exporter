name: Enrich compositions

# 저장된 카탈로그의 혼용률·컬러웨이를 미리 채운다 — 보드 스캐너가 스캔 순간에
# 상품 페이지를 읽지 않아도 되게. 점검(Catalog audit)이 끝난 뒤 이어서 돈다.
on:
  workflow_run:
    workflows: ["Catalog audit (non-product items)"]
    types: [completed]
  schedule:
    - cron: "30 20 * * *"   # UTC 20:30 = KST 05:30 — 연결이 끊겼을 때의 예비
    - cron: "0 */2 * * *"   # 2시간마다 — 수요일 마감까지 컬러·혼용률 채우기
  workflow_dispatch:
    inputs:
      per_brand:
        description: "브랜드당 상한"
        required: false
        default: "800"
      total:
        description: "전체 상한"
        required: false
        default: "40000"
      need_fields:
        description: "채워야 할 항목 (기본 comp — 컬러는 여는 김에 함께 채워진다)"
        required: false
        default: "comp"
      retry_days:
        description: "빈손이었던 상품을 다시 시도하기까지의 일수"
        required: false
        default: "5"
      retry_all:
        description: "1 이면 재시도 창을 무시하고 빈 항목을 전부 다시 읽는다"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: enrich-comp
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 110   # 2시간 주기보다 짧게 — 다음 회차와 겹치지 않게
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enrich compositions
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          PER_BRAND: ${{ github.event.inputs.per_brand }}
          TOTAL: ${{ github.event.inputs.total }}
          NEED_FIELDS: ${{ github.event.inputs.need_fields }}
          RETRY_DAYS: ${{ github.event.inputs.retry_days }}
          # 새벽 회차(KST 05:30)는 재시도 창을 무시하고 빈 혼용률을 전부 다시 읽는다.
          # 창에 갇힌 상품이 매일 +0 으로 굳는 것을 막는다 — 실제로 그 상태였다.
          # 2시간마다 도는 회차는 창을 지킨다(같은 실패를 하루에 열두 번 반복하지 않게).
          RETRY_ALL: ${{ github.event.inputs.retry_all || (github.event.schedule == '30 20 * * *' && '1' || '') }}
          # 브랜드 5개를 동시에, 각 브랜드 안에서 8개씩 = 전체 40개 동시.
          # 한 사이트로 가는 동시 요청은 8개라 예전(10개)보다 오히려 정중하다.
          BRAND_POOL: ${{ vars.BRAND_POOL || '5' }}
          PAGE_POOL: ${{ vars.PAGE_POOL || '8' }}
        run: node scripts/enrich-comp.mjs
      - name: Commit report
        if: always()
        run: |
          git config user.name "collect-bot"
          git config user.email "collect-bot@users.noreply.github.com"
          git add -A -- enrich-comp-report.md || true
          git commit -m "enrich-comp: 혼용률·컬러 보강 리포트" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase --autostash -X ours origin ${{ github.ref_name }} \
              && git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep 5
          done
          echo "::warning::report push failed after retries"
