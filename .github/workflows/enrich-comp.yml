name: Enrich compositions

# 저장된 카탈로그의 혼용률(comp)을 밤새 미리 채운다 — 보드 스캐너가 스캔 순간에
# 상품 페이지를 읽지 않아도 되게. 점검(Catalog audit)이 끝난 뒤 이어서 돈다.
on:
  workflow_run:
    workflows: ["Catalog audit (non-product items)"]
    types: [completed]
  schedule:
    - cron: "30 20 * * *"   # UTC 20:30 = KST 05:30 — 연결이 끊겼을 때의 예비
    - cron: "0 */2 * * *"   # 2시간마다 — 수요일 마감까지 컬러·혼용률 채우기
  workflow_dispatch:
    inputs:
      per_brand:
        description: "브랜드당 상한"
        required: false
        default: "800"
      total:
        description: "전체 상한"
        required: false
        default: "40000"
      need_fields:
        description: "채워야 할 항목 (comp,color)"
        required: false
        default: "comp,color"
      retry_days:
        description: "빈손이었던 상품을 다시 시도하기까지의 일수"
        required: false
        default: "5"

permissions:
  contents: write

concurrency:
  group: enrich-comp
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 110   # 2시간 주기보다 짧게 — 다음 회차와 겹치지 않게
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enrich compositions
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          PER_BRAND: ${{ github.event.inputs.per_brand }}
          TOTAL: ${{ github.event.inputs.total }}
          NEED_FIELDS: ${{ github.event.inputs.need_fields }}
          RETRY_DAYS: ${{ github.event.inputs.retry_days }}
        run: node scripts/enrich-comp.mjs
      - name: Commit report
        if: always()
        run: |
          git config user.name "collect-bot"
          git config user.email "collect-bot@users.noreply.github.com"
          git add -A -- enrich-comp-report.md || true
          git commit -m "enrich-comp: nightly composition backfill" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase --autostash -X ours origin ${{ github.ref_name }} \
              && git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep 5
          done
          echo "::warning::report push failed after retries"
