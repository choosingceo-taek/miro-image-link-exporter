name: Enrich compositions

# 저장된 카탈로그의 혼용률·컬러웨이를 미리 채운다 — 보드 스캐너가 스캔 순간에
# 상품 페이지를 읽지 않아도 되게. 점검(Catalog audit)이 끝난 뒤 이어서 돈다.
on:
  workflow_run:
    workflows: ["Catalog audit (non-product items)"]
    types: [completed]
  schedule:
    - cron: "30 20 * * *"   # UTC 20:30 = KST 05:30 — 연결이 끊겼을 때의 예비
    # 2시간마다 돌리던 마감용 임시 일정은 뺐다 — 11월 마지막 40회 중 절반 가까이가 +0~+2개였다.
    # 같은 상품은 5일 재시도 창에 걸려 있어 하루 여러 번 돌아도 새로 읽을 것이 없다.
    # 낮에 한 번만 더 돌려 그날 들어온 신상품을 받는다.
    - cron: "0 7 * * *"     # UTC 07:00 = KST 16:00
  workflow_dispatch:
    inputs:
      per_brand:
        description: "브랜드당 상한"
        required: false
        default: "800"
      total:
        description: "전체 상한"
        required: false
        default: "40000"
      need_fields:
        description: "채워야 할 항목 (기본 comp — 컬러는 여는 김에 함께 채워진다)"
        required: false
        default: "comp"
      retry_days:
        description: "빈손이었던 상품을 다시 시도하기까지의 일수"
        required: false
        default: "5"
      retry_all:
        description: "1 이면 재시도 창을 무시하고 빈 항목을 전부 다시 읽는다"
        required: false
        default: ""
      brand_pool:
        description: "동시에 처리할 브랜드 수 (기본 5)"
        required: false
        default: ""
      page_pool:
        description: "브랜드 안에서 동시에 읽을 상품 수 (기본 8 — 같은 사이트로 몰리므로 과하면 429)"
        required: false
        default: ""
      timeout_min:
        description: "이 실행의 제한 시간(분, 기본 110)"
        required: false
        default: ""
      # 아래 둘은 측정용. 예약·workflow_run 실행에는 inputs 가 비어 있어 평소와 똑같이 돈다.
      # (workflow_dispatch 입력은 10개가 상한이라 아카이브 상한은 저장소 변수 WAYBACK_MAX ·
      #  WAYBACK_PER_BRAND · WAYBACK 으로 바꾼다)
      dry:
        description: "1 이면 읽기만 하고 아무것도 저장하지 않는다(리포트는 enrich-comp-dry-report.md)"
        required: false
        default: ""
      brands:
        description: "이 브랜드만 (쉼표로 구분, 대소문자 무시). 비우면 전부"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: enrich-comp
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    # 기본 110분 — 2시간 주기보다 짧게 잡아 다음 회차와 겹치지 않게 한다.
    # 아침까지 길게 돌려야 할 때만 timeout_min 으로 늘린다.
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_min || '110') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enrich compositions
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          PER_BRAND: ${{ github.event.inputs.per_brand }}
          TOTAL: ${{ github.event.inputs.total }}
          NEED_FIELDS: ${{ github.event.inputs.need_fields }}
          RETRY_DAYS: ${{ github.event.inputs.retry_days }}
          # 새벽 회차(KST 05:30)는 재시도 창을 무시하고 빈 혼용률을 전부 다시 읽는다.
          # 창에 갇힌 상품이 매일 +0 으로 굳는 것을 막는다 — 실제로 그 상태였다.
          # 2시간마다 도는 회차는 창을 지킨다(같은 실패를 하루에 열두 번 반복하지 않게).
          RETRY_ALL: ${{ github.event.inputs.retry_all || (github.event.schedule == '30 20 * * *' && '1' || '') }}
          # 브랜드 5개를 동시에, 각 브랜드 안에서 8개씩 = 전체 40개 동시.
          # 한 사이트로 가는 동시 요청은 8개라 예전(10개)보다 오히려 정중하다.
          BRAND_POOL: ${{ github.event.inputs.brand_pool || vars.BRAND_POOL || '5' }}
          PAGE_POOL: ${{ github.event.inputs.page_pool || vars.PAGE_POOL || '8' }}
          # 측정 실행 — '1' 일 때만 켜진다. 예약 실행에서는 빈 값이라 평소대로 저장한다.
          DRY: ${{ github.event.inputs.dry == '1' && '1' || '' }}
          BRANDS: ${{ github.event.inputs.brands || '' }}
          # 웹 아카이브 층 — 저장소 변수로만 바꾼다(비면 스크립트 기본값: 켬 · 400 · 브랜드당 40).
          WAYBACK: ${{ vars.WAYBACK || '' }}
          WAYBACK_MAX: ${{ vars.WAYBACK_MAX || '' }}
          WAYBACK_PER_BRAND: ${{ vars.WAYBACK_PER_BRAND || '' }}
        run: node scripts/enrich-comp.mjs
      - name: Commit report
        if: always()
        env:
          DRY: ${{ github.event.inputs.dry == '1' && '1' || '' }}
        run: |
          git config user.name "collect-bot"
          git config user.email "collect-bot@users.noreply.github.com"
          # DRY 실행은 측정 리포트 하나만 올린다 — 진짜 리포트를 덮지 않게.
          if [ "$DRY" = "1" ]; then
            git add -- enrich-comp-dry-report.md || true
            git commit -m "enrich-comp: 측정 실행(DRY) 리포트 — 저장 안 함" || echo "no changes"
          else
            git add -A -- enrich-comp-report.md || true
            git commit -m "enrich-comp: 혼용률·컬러 보강 리포트" || echo "no changes"
          fi
          for i in 1 2 3; do
            git pull --rebase --autostash -X ours origin ${{ github.ref_name }} \
              && git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep 5
          done
          echo "::warning::report push failed after retries"
