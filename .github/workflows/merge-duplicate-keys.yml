name: Merge duplicate keys

# 같은 브랜드가 두 벌 저장된 것을 한 벌로 합친다(합집합 → 새 키 저장 → 옛 키 삭제).
# 기본은 미리보기다. 실제로 바꾸려면 apply 를 "1" 로 넣고 수동 실행한다.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "1 이면 실제로 합치고 옛 키를 지운다 (비우면 미리보기)"
        required: false
        default: ""

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Merge duplicate catalog keys
        env:
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          APPLY: ${{ github.event.inputs.apply }}
        run: node scripts/merge-duplicate-keys.mjs
