name: Enrich compositions (real Chrome)

# 평 fetch 로는 차단되는 브랜드의 혼용률을 진짜 크롬으로 읽는다.
#
# 야간 보강(enrich-comp.mjs)은 fetch 로 상품 페이지를 읽어서, 봇을 막는
# 사이트는 통째로 0% 로 남았다. 진단 표본에서 Joules 10/10, Patagonia 10/10 이
# '직접차단'이었다 — 두 브랜드만 519개다. Worker 우회(Cloudflare IP)도 같은
# 이유로 안 뚫린다.
#
# 헤드리스 크롬은 같은 데이터센터 IP 로도 19개 브랜드를 매일 긁고 있다.
# 그 통로를 혼용률에도 쓰는 것이 이 워크플로다.
on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21:00 = KST 06:00 — 야간 수집이 다 끝난 뒤
  workflow_dispatch:
    inputs:
      brands:
        description: "쉼표로 구분한 브랜드(비우면 혼용률 낮은 순 자동 선택)"
        required: false
        default: ""
      top:
        description: "브랜드 수 상한"
        required: false
        default: "6"
      per_brand:
        description: "브랜드당 상품 수"
        required: false
        default: "120"
      store:
        description: "1이면 저장(기본 1) · 0이면 결과만"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: enrich-browser
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        # 이 설치 단계가 두 번 하루치 작업을 통째로 날렸다.
        #  · 8/15 — 시간 제한이 없어 90분을 멈춘 채 쓰고 워크플로가 취소됐다.
        #  · 8/19 — apt 잠금 충돌로 세 번 다 실패했다(재시도 간격이 15초라 소용없었다).
        # 그래서 시간을 끊고, 잠금이 풀리길 기다리고, 그래도 안 되면 시스템 패키지
        # 없이라도 브라우저를 받아 둔다.
        timeout-minutes: 20
        run: |
          npm init -y >/dev/null
          timeout 240 npm i --no-save playwright@1.49.1
          # --with-deps 는 apt-get 을 돌린다. 러너가 부팅 직후 자기 프로비저닝으로
          # apt 를 잡고 있으면 여기서 dpkg 잠금 충돌로 죽는다(2026-08-19 실패 원인:
          # "Could not get lock /var/lib/dpkg/lock-frontend"). 잠금이 풀릴 때까지
          # 기다린 뒤 시도하고, 간격도 넉넉히 둔다 — 15초로는 세 번 다 같은 잠금에 걸렸다.
          waitlock() {
            for _ in $(seq 1 60); do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || return 0
              sleep 5
            done
          }
          for wait in 0 30 60; do
            [ "$wait" -gt 0 ] && sleep "$wait"
            waitlock
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "설치 실패 — 다시 시도"
          done
          # apt 가 끝내 안 풀려도 브라우저 자체는 받아 둔다. ubuntu-latest 이미지에는
          # 크로미움이 쓰는 공유 라이브러리가 대체로 이미 들어 있어, 이것만으로도
          # 도는 경우가 많다. 아무것도 못 하고 끝내는 것보다 낫다.
          echo "--with-deps 실패 — 시스템 패키지 없이 브라우저만 내려받아 봅니다"
          timeout 300 npx playwright install chromium
      - name: Enrich
        env:
          BRANDS: ${{ github.event.inputs.brands }}
          TOP: ${{ github.event.inputs.top || '6' }}
          PER_BRAND: ${{ github.event.inputs.per_brand || '120' }}
          STORE: ${{ github.event.inputs.store || '1' }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: node scripts/enrich-comp-browser.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrich-browser-report
          path: |
            enrich-browser-report.md
            enrich-browser-state.json
          if-no-files-found: ignore
      - name: Commit report
        if: always()
        run: |
          git config user.name "collect-bot"
          git config user.email "collect-bot@users.noreply.github.com"
          rm -f package.json package-lock.json
          # 이력 파일도 함께 올려야 다음 실행이 차단 브랜드를 기억한다.
          # 이게 빠지면 매 실행이 백지에서 시작해 같은 벽에 다시 부딪힌다.
          git add -A -- enrich-browser-report.md enrich-browser-state.json || true
          git commit -m "enrich-browser: real-chrome composition pass" || echo "no changes"
          # 리포트는 매번 통째로 새로 쓰이므로, 충돌하면 이번 실행 결과를 채택한다.
          for i in 1 2 3; do
            if git pull --rebase --autostash -X ours origin ${{ github.ref_name }}; then
              git push origin HEAD:${{ github.ref_name }} && exit 0
            else
              git rebase --abort || true
              git fetch origin ${{ github.ref_name }}
              git reset --soft origin/${{ github.ref_name }}
              git add -A -- enrich-browser-report.md enrich-browser-state.json
              git commit -m "enrich-browser: real-chrome composition pass" || true
            fi
            sleep 5
          done
