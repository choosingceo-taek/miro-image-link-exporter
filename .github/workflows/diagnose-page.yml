name: Diagnose stuck pages

# 상품이 0개로 나오는 목록 페이지를 진짜 크롬으로 열어 구조를 뜯어본다.
#
# 야간 수집 리포트는 "링크 259개 중 230개가 이미지 없음"까지만 알려 준다.
# 왜 이미지가 안 붙는지(지연 로딩·CSS 배경·shadow DOM·차단)를 모르면 선택자를
# 어디서 고쳐야 할지 정할 수 없어서, 며칠째 같은 브랜드가 0개로 남았다.
#
# 헤드리스 수집(03:30) 뒤에 돌려 그날 막힌 페이지의 원인을 리포트에 남긴다.
on:
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = KST 04:00 — 헤드리스 수집(03:30) 직후
  workflow_dispatch:
    inputs:
      urls:
        description: "쉼표로 구분한 URL (비우면 그날 0개였던 목록 페이지)"
        required: false
        default: ""
      mode:
        description: "page(기본, 목록 구조 진단) | engines(무료 크롤링 엔진 비교 — try-engines)"
        required: false
        default: "page"
      engines:
        description: "mode=engines 일 때 돌릴 엔진(쉼표 구분, 비우면 전부)"
        required: false
        default: ""
      brands:
        description: "mode=engines 일 때 상품 페이지를 뽑을 브랜드(쉼표 구분, 비우면 기본 12개)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: diagnose-page
  cancel-in-progress: false

jobs:
  diagnose:
    if: ${{ github.event.inputs.mode != 'engines' }}
    runs-on: ubuntu-latest
    # 설치 재시도(최대 20분)에 자리를 내주고도 진단이 돌 수 있게 넉넉히 잡는다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        # 이 설치 단계가 두 번 하루치 작업을 통째로 날렸다.
        #  · 8/15 — 시간 제한이 없어 90분을 멈춘 채 쓰고 워크플로가 취소됐다.
        #  · 8/19 — apt 잠금 충돌로 세 번 다 실패했다(재시도 간격이 15초라 소용없었다).
        # 그래서 시간을 끊고, 잠금이 풀리길 기다리고, 그래도 안 되면 시스템 패키지
        # 없이라도 브라우저를 받아 둔다.
        timeout-minutes: 20
        run: |
          npm init -y >/dev/null
          timeout 240 npm i --no-save playwright@1.49.1
          # --with-deps 는 apt-get 을 돌린다. 러너가 부팅 직후 자기 프로비저닝으로
          # apt 를 잡고 있으면 여기서 dpkg 잠금 충돌로 죽는다(2026-08-19 실패 원인:
          # "Could not get lock /var/lib/dpkg/lock-frontend"). 잠금이 풀릴 때까지
          # 기다린 뒤 시도하고, 간격도 넉넉히 둔다 — 15초로는 세 번 다 같은 잠금에 걸렸다.
          waitlock() {
            for _ in $(seq 1 60); do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || return 0
              sleep 5
            done
          }
          for wait in 0 30 60; do
            [ "$wait" -gt 0 ] && sleep "$wait"
            waitlock
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "설치 실패 — 다시 시도"
          done
          # apt 가 끝내 안 풀려도 브라우저 자체는 받아 둔다. ubuntu-latest 이미지에는
          # 크로미움이 쓰는 공유 라이브러리가 대체로 이미 들어 있어, 이것만으로도
          # 도는 경우가 많다. 아무것도 못 하고 끝내는 것보다 낫다.
          echo "--with-deps 실패 — 시스템 패키지 없이 브라우저만 내려받아 봅니다"
          timeout 300 npx playwright install chromium
      - name: Diagnose
        env:
          # 비우면 그날 헤드리스 수집 리포트에서 '상품 0개'로 끝난 페이지를 스스로 고른다.
          # (예전엔 여기에 Carhartt·American Eagle·Aerie·Apiece Apart 주소 4개가 박혀 있어,
          #  수집기가 이미 그 페이지에서 25~49개씩 모으고 있는데도 매일 같은 4개를 진단했다.)
          URLS: ${{ github.event.inputs.urls }}
        run: node scripts/diagnose-page.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-page
          path: diagnose-page.md
          if-no-files-found: ignore
      - name: Commit report
        if: always()
        run: |
          git config user.name "collect-bot"
          git config user.email "collect-bot@users.noreply.github.com"
          rm -f package.json package-lock.json
          git add -A -- diagnose-page.md || true
          git commit -m "diagnose: stuck listing pages" || echo "no changes"
          # 리포트는 매번 통째로 새로 쓰이므로, 충돌하면 이번 실행 결과를 채택한다.
          for i in 1 2 3; do
            if git pull --rebase --autostash -X ours origin ${{ github.ref_name }}; then
              git push origin HEAD:${{ github.ref_name }} && exit 0
            else
              git rebase --abort || true
              git fetch origin ${{ github.ref_name }}
              git reset --soft origin/${{ github.ref_name }}
              git add -A -- diagnose-page.md
              git commit -m "diagnose: stuck listing pages" || true
            fi
            sleep 5
          done

  # 새 워크플로는 main 에 합쳐지기 전엔 수동 실행이 안 돼서, 여기 mode=engines 로도 돌 수 있게 둔다.
  engines:
    if: ${{ github.event.inputs.mode == 'engines' }}
    runs-on: ubuntu-latest
    # 엔진마다 최대 12분(ENGINE_MIN) × 브라우저 엔진 5~6개 + 설치 25분
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install engines
        timeout-minutes: 25
        env:
          # camoufox-js 는 브라우저를 GitHub API 로 찾는다. 토큰 없이 부르면 공유 러너 IP 의
          # 시간당 한도에 걸려 "Failed to fetch releases … after 5 attempts" 로 끝난다(11/24 실행).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm init -y >/dev/null
          # --no-save 설치는 따로 하면 앞에 받은 것을 지운다 — 한 번에 받는다.
          timeout 400 npm i --no-save playwright@1.49.1 patchright@1.49.1 crawlee@3.18.2 camoufox-js@0.13.0 impit@0.14.9 fingerprint-generator@2.1.89 fingerprint-injector@2.1.89
          waitlock() { for _ in $(seq 1 60); do sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || return 0; sleep 5; done; }
          waitlock
          timeout 400 npx playwright install --with-deps chromium firefox || timeout 400 npx playwright install chromium firefox
          timeout 300 npx patchright install chromium || echo "patchright 브라우저 설치 실패 — 그 엔진만 오류로 나온다"
          timeout 400 npx camoufox-js fetch || echo "camoufox 내려받기 실패 — 그 엔진만 오류로 나온다"
      - name: Try
        env:
          ENGINES: ${{ github.event.inputs.engines }}
          BRANDS: ${{ github.event.inputs.brands }}
          LISTINGS: ""
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/try-engines.mjs
      - name: Commit report
        if: always()
        run: |
          git config user.name "collect-bot"
          git config user.email "collect-bot@users.noreply.github.com"
          rm -f package.json package-lock.json
          git add -A -- try-engines-report.md || true
          git commit -m "try-engines: free crawler comparison" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase --autostash -X ours origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep 5
          done
          echo "::warning::report push failed"
