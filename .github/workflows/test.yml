name: Collector tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run category regression tests
        run: node scripts/test-category.mjs
      - name: Run price parser tests
        run: node scripts/test-price.mjs
      - name: Run excel row tests
        run: node scripts/test-rowvalues.mjs
      - name: Run structured-data (JSON-LD) tests
        run: node scripts/test-jsonld.mjs
      - name: Run composition-from-text tests
        run: node scripts/test-composition.mjs
      - name: Run colorway extraction tests
        run: node scripts/test-color.mjs
      - name: Run value validity tests
        run: node scripts/test-valid.mjs
      - name: Run panel load test
        run: node scripts/test-panel-load.mjs
      - name: Run overlay merge test
        run: node scripts/test-overlay-merge.mjs
      - name: Run settings wiring test
        run: node scripts/test-settings-wiring.mjs
      - name: Run non-product filter test
        run: node scripts/test-nonproduct.mjs
      - name: Syntax check panel/extension/userscript
        run: |
          node --check chrome-extension/background.js
          node --check chrome-extension/collector.js
          node --check chrome-extension/popup.js
          node --check scripts/browser-collect.mjs
          node --check rack-harvester.user.js
          node --check worker/fabric-extractor.js
