name: Headless browser collect

# Render 스크래퍼로는 못 읽지만 진짜 크롬이면 읽히는 브랜드(blocked-brands.json 의 browser 그룹)를
# 매일 자동 수집한다. 사람 PC가 필요 없다 — 남은 확장 담당 브랜드만 크롬 확장이 맡는다.
#
# 수동 실행 시 group=extension 으로 두면 확장 담당 브랜드를 재조사할 수 있다
# (차단이 풀렸는지 확인용). 그때는 store=0 으로 두고 결과 리포트만 본다.
on:
  schedule:
    - cron: "40 18 * * *"   # UTC 18:40 = KST 03:40 — 야간 프리페치(03:00) 뒤에 이어서
  workflow_dispatch:
    inputs:
      group:
        description: "browser(기본) | extension(재조사) | all"
        required: false
        default: "browser"
      brands:
        description: "쉼표로 구분한 브랜드(비우면 그룹 전체)"
        required: false
        default: ""
      store:
        description: "1이면 Worker KV에 저장(기본 1)"
        required: false
        default: "1"
      max_pages:
        description: "카테고리당 최대 페이지"
        required: false
        default: "8"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Collect
        env:
          # schedule 실행에는 inputs 가 없으므로 기본값을 여기서 채운다.
          GROUP: ${{ github.event.inputs.group || 'browser' }}
          BRANDS: ${{ github.event.inputs.brands }}
          STORE: ${{ github.event.inputs.store || '1' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '8' }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: node scripts/browser-collect.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-collect-report
          path: |
            browser-collect-report.json
            browser-collect-report.md
          if-no-files-found: ignore
      - name: Commit report
        if: always()
        run: |
          git config user.name "collect-bot"
          git config user.email "collect-bot@users.noreply.github.com"
          rm -f package.json package-lock.json
          git add -A -- browser-collect-report.json browser-collect-report.md || true
          git commit -m "browser-collect: headless chrome results" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} \
              && git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep 5
          done
          echo "::warning::report push failed after retries"
