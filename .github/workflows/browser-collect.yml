name: Headless browser collect (extension brands)

# 확장 담당 브랜드를 진짜 크롬(headless)으로 돌려본다.
# · 기본은 조사 모드(store=0) — 저장소를 건드리지 않고 어떤 브랜드가 되는지만 본다.
# · store=1 로 돌리면 확장과 동일한 키/형식으로 Worker KV에 저장한다.
on:
  workflow_dispatch:
    inputs:
      brands:
        description: "쉼표로 구분한 브랜드(비우면 확장 담당 전체)"
        required: false
        default: ""
      store:
        description: "1이면 Worker KV에 저장(기본 0 = 조사만)"
        required: false
        default: "0"
      max_pages:
        description: "카테고리당 최대 페이지"
        required: false
        default: "8"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Collect
        env:
          BRANDS: ${{ github.event.inputs.brands }}
          STORE: ${{ github.event.inputs.store }}
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: node scripts/browser-collect.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-collect-report
          path: |
            browser-collect-report.json
            browser-collect-report.md
          if-no-files-found: ignore
      - name: Commit report
        if: always()
        run: |
          git config user.name "collect-bot"
          git config user.email "collect-bot@users.noreply.github.com"
          rm -f package.json package-lock.json
          git add -A -- browser-collect-report.json browser-collect-report.md || true
          git commit -m "browser-collect: headless chrome results" || echo "no changes"
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} \
              && git push origin HEAD:${{ github.ref_name }} && exit 0
            sleep 5
          done
          echo "::warning::report push failed after retries"
