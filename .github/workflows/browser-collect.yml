name: Headless browser collect

# Render 스크래퍼로는 못 읽지만 진짜 크롬이면 읽히는 브랜드(blocked-brands.json 의 browser 그룹)를
# 매일 자동 수집한다. 사람 PC가 필요 없다 — 남은 확장 담당 브랜드만 크롬 확장이 맡는다.
#
# 수동 실행 시 group=extension 으로 두면 확장 담당 브랜드를 재조사할 수 있다
# (차단이 풀렸는지 확인용). 그때는 store=0 으로 두고 결과 리포트만 본다.
#
# 저장소의 browser-extra-brands.json 에 적힌 브랜드도 함께 돈다(서버 프리페치가 목록에서
# 막히는 브랜드 · 브랜드마다 엔진을 고른다). 저장 조건이 더 엄격하다 — DAILY-AUTOMATION.md 참고.
on:
  schedule:
    - cron: "30 18 * * *"   # UTC 18:30 = KST 03:30 — 서버 프리페치(03:00) 뒤에 이어서
  workflow_dispatch:
    inputs:
      group:
        description: "browser(기본) | extension(재조사) | all"
        required: false
        default: "browser"
      brands:
        description: "쉼표로 구분한 브랜드(비우면 그룹 전체)"
        required: false
        default: ""
      store:
        description: "1이면 Worker KV에 저장(기본 1)"
        required: false
        default: "1"
      max_pages:
        description: "카테고리당 최대 페이지"
        required: false
        default: "8"
      engine:
        # 비워 두는 것이 기본이다. 비우면 Render browser 그룹은 chromium, 추가 브랜드 파일
        # (browser-extra-brands.json)의 브랜드는 거기 적힌 엔진으로 돈다 — 예약 실행과 같다.
        # chromium·firefox 를 적으면 모든 브랜드를 그 엔진으로 돈다(비교 측정용).
        description: "비우면 브랜드별 기본(예약 실행과 같음) · chromium | firefox 면 모든 브랜드를 그 엔진으로"
        required: false
        default: ""
      fresh_context:
        description: "1이면 카테고리 URL 마다 쿠키가 빈 새 창으로 연다(측정용, 기본 0)"
        required: false
        default: "0"
      deadline_min:
        description: "시간 예산(분). 비우면 스크립트 기본값(85). 시험 실행은 store=0 과 함께 작게"
        required: false
        default: ""
      extra_file:
        description: "추가 브랜드 파일(비우면 browser-extra-brands.json). 측정용 후보 파일은 store=0 과 함께"
        required: false
        default: ""
      report_tag:
        description: "주면 리포트를 browser-collect-<tag>-<실행번호>.json/.md 로 따로 남긴다(측정 실행 — 운영 리포트를 덮지 않음)"
        required: false
        default: ""

permissions:
  contents: write

# 같은 워크플로가 겹쳐 돌면 리포트 파일에서 rebase 충돌이 나 결과를 못 올린다.
# 단, 측정 실행(report_tag 를 준 실행 — 운영 리포트를 건드리지 않는다)은 실행마다 따로 돈다:
# 같은 대상을 다른 러너(IP)에서 동시에 재야 해서다. 측정 실행은 반드시 store=0 으로 한다.
concurrency:
  group: browser-collect${{ github.event.inputs.report_tag && format('-measure-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  # 두 잡이 동시에 돈다(시간 예산 85분을 나눠 쓰지 않도록).
  #  · main  — Render browser 그룹(추가 브랜드 파일의 엔진·새 창 바꾸기 포함) → browser-collect-report.*
  #  · extra — 추가 브랜드 파일의 새 브랜드만 → browser-collect-extra-report.*
  collect:
    strategy:
      fail-fast: false
      matrix:
        part: [main, extra]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pick browsers
        # 크롬은 늘 받는다. 파이어폭스는 엔진으로 firefox 를 골랐거나, 추가 브랜드 파일에
        # firefox 브랜드가 있을 때만 받는다(설치 시간이 몇 분 더 든다).
        id: pick
        env:
          ENGINE_IN: ${{ github.event.inputs.engine }}
          EXTRA_IN: ${{ github.event.inputs.extra_file || 'browser-extra-brands.json' }}
        run: |
          list="chromium"
          if [ "$ENGINE_IN" = "firefox" ]; then list="chromium firefox"; fi
          if [ -z "$ENGINE_IN" ] && [ -f "$EXTRA_IN" ] && node -e '
            const d = JSON.parse(require("fs").readFileSync(process.env.EXTRA_IN, "utf8"));
            process.exit((d.brands || []).some((b) => String(b.engine || "").toLowerCase() === "firefox") ? 0 : 1);'; then
            list="chromium firefox"
          fi
          echo "browsers=$list" >> "$GITHUB_OUTPUT"
          echo "설치할 브라우저: $list"
      - name: Install Playwright browsers
        # 이 설치 단계가 두 번 하루치 작업을 통째로 날렸다.
        #  · 8/15 — 시간 제한이 없어 90분을 멈춘 채 쓰고 워크플로가 취소됐다.
        #  · 8/19 — apt 잠금 충돌로 세 번 다 실패했다(재시도 간격이 15초라 소용없었다).
        # 그래서 시간을 끊고, 잠금이 풀리길 기다리고, 그래도 안 되면 시스템 패키지
        # 없이라도 브라우저를 받아 둔다.
        timeout-minutes: 20
        env:
          BROWSERS: ${{ steps.pick.outputs.browsers }}
        run: |
          npm init -y >/dev/null
          # impit — 브라우저 없이 크롬의 TLS 지문으로 HTML 을 받는 엔진(추가 브랜드의 engine: "impit").
          # 한 명령으로 함께 받는다 — --no-save 는 따로 받으면 앞서 받은 패키지를 지운다(2026-11-25 실제로
          # playwright 가 사라져 수집이 시작도 못 했다). impit 이 실패하면 playwright 만이라도 받는다.
          timeout 240 npm i --no-save playwright@1.49.1 impit@0.14.9 || {
            echo "::warning::impit 설치 실패 — impit 엔진 브랜드는 오류로 적힌다"
            timeout 240 npm i --no-save playwright@1.49.1
          }
          # --with-deps 는 apt-get 을 돌린다. 러너가 부팅 직후 자기 프로비저닝으로
          # apt 를 잡고 있으면 여기서 dpkg 잠금 충돌로 죽는다(2026-08-19 실패 원인:
          # "Could not get lock /var/lib/dpkg/lock-frontend"). 잠금이 풀릴 때까지
          # 기다린 뒤 시도하고, 간격도 넉넉히 둔다 — 15초로는 세 번 다 같은 잠금에 걸렸다.
          waitlock() {
            for _ in $(seq 1 60); do
              sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || return 0
              sleep 5
            done
          }
          for wait in 0 30 60; do
            [ "$wait" -gt 0 ] && sleep "$wait"
            waitlock
            timeout 300 npx playwright install --with-deps $BROWSERS && exit 0
            echo "설치 실패 — 다시 시도"
          done
          # apt 가 끝내 안 풀려도 브라우저 자체는 받아 둔다. ubuntu-latest 이미지에는
          # 크로미움이 쓰는 공유 라이브러리가 대체로 이미 들어 있어, 이것만으로도
          # 도는 경우가 많다. 아무것도 못 하고 끝내는 것보다 낫다.
          echo "--with-deps 실패 — 시스템 패키지 없이 브라우저만 내려받아 봅니다"
          timeout 300 npx playwright install $BROWSERS
      - name: Collect
        env:
          # schedule 실행에는 inputs 가 없으므로 기본값을 여기서 채운다.
          GROUP: ${{ github.event.inputs.group || 'browser' }}
          BRANDS: ${{ github.event.inputs.brands }}
          STORE: ${{ github.event.inputs.store || '1' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '8' }}
          # 비어 있으면 스크립트 기본값(85분)이 쓰인다.
          DEADLINE_MIN: ${{ github.event.inputs.deadline_min }}
          # 예약 실행에는 inputs 가 없어 비어 있다 → 스크립트가 브랜드별 기본 엔진을 쓴다
          # (Render browser 그룹은 chromium, 추가 브랜드는 browser-extra-brands.json 에 적힌 엔진).
          ENGINE: ${{ github.event.inputs.engine }}
          FRESH_CONTEXT: ${{ github.event.inputs.fresh_context || '0' }}
          EXTRA_BRANDS_FILE: ${{ github.event.inputs.extra_file }}
          EXTRA_MODE: ${{ matrix.part == 'main' && 'skip' || 'only' }}
          REPORT_TAG: ${{ github.event.inputs.report_tag && format('{0}-{1}{2}', github.event.inputs.report_tag, github.run_id, matrix.part == 'extra' && '-extra' || '') || (matrix.part == 'extra' && 'extra-report' || '') }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: |
          echo "STORE: $STORE · 잡: ${{ matrix.part }}(EXTRA_MODE=$EXTRA_MODE) · REPORT_TAG: ${REPORT_TAG:-(운영 리포트)} · EXTRA: ${EXTRA_BRANDS_FILE:-browser-extra-brands.json}"
          # 측정 실행이 저장까지 하면 운영 카탈로그를 바꾼다 — 막는다.
          if [ -n "$REPORT_TAG" ] && [ "$STORE" != "0" ]; then echo "::error::report_tag(측정 실행)는 store=0 으로만 돌린다"; exit 1; fi
          node scripts/browser-collect.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-collect-report-${{ matrix.part }}
          path: |
            browser-collect-report.json
            browser-collect-report.md
            browser-collect-*.json
            browser-collect-*.md
          if-no-files-found: ignore
      - name: Commit report
        if: always()
        run: |
          git config user.name "collect-bot"
          git config user.email "collect-bot@users.noreply.github.com"
          rm -f package.json package-lock.json
          git add -A -- browser-collect-report.json browser-collect-report.md 'browser-collect-*.json' 'browser-collect-*.md' || true
          git commit -m "browser-collect: headless chrome results" || echo "no changes"
          # 리포트는 매번 통째로 새로 쓰이므로, 충돌하면 이번 실행 결과를 채택한다.
          # rebase 에서는 ours = 원격(먼저 올라간 쪽), theirs = 지금 다시 얹는 이번 실행의 커밋이다.
          # 예전엔 -X ours 라서 겹쳐 돈 두 실행 중 뒤 실행의 리포트가 "이미 반영됨"으로 통째로
          # 버려졌다(2026-11-24 run 45322447710 — 리포트 커밋이 사라지고 아티팩트에만 남음).
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin ${{ github.ref_name }}; then
              git push origin HEAD:${{ github.ref_name }} && exit 0
            else
              git rebase --abort || true
              git fetch origin ${{ github.ref_name }}
              git reset --soft origin/${{ github.ref_name }}
              git add -A -- browser-collect-report.json browser-collect-report.md 'browser-collect-*.json' 'browser-collect-*.md'
              git commit -m "browser-collect: headless chrome results" || true
            fi
            sleep 5
          done
          echo "::warning::report push failed after retries"
