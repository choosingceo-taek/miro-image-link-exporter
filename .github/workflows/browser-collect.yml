name: Headless browser collect

# Render 스크래퍼로는 못 읽지만 진짜 크롬이면 읽히는 브랜드(blocked-brands.json 의 browser 그룹)를
# 매일 자동 수집한다. 사람 PC가 필요 없다 — 남은 확장 담당 브랜드만 크롬 확장이 맡는다.
#
# 수동 실행 시 group=extension 으로 두면 확장 담당 브랜드를 재조사할 수 있다
# (차단이 풀렸는지 확인용). 그때는 store=0 으로 두고 결과 리포트만 본다.
on:
  schedule:
    - cron: "30 18 * * *"   # UTC 18:30 = KST 03:30 — 서버 프리페치(03:00) 뒤에 이어서
  workflow_dispatch:
    inputs:
      group:
        description: "browser(기본) | extension(재조사) | all"
        required: false
        default: "browser"
      brands:
        description: "쉼표로 구분한 브랜드(비우면 그룹 전체)"
        required: false
        default: ""
      store:
        description: "1이면 Worker KV에 저장(기본 1)"
        required: false
        default: "1"
      max_pages:
        description: "카테고리당 최대 페이지"
        required: false
        default: "8"

permissions:
  contents: write

# 같은 워크플로가 겹쳐 돌면 리포트 파일에서 rebase 충돌이 나 결과를 못 올린다.
concurrency:
  group: browser-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        # 이 단계에 자체 시간 제한이 없으면, 설치가 멈췄을 때 워크플로 상한을
        # 통째로 먹고 정작 할 일은 시작도 못 한다. 2026-08-15 에 실제로 그랬다 —
        # 90분을 설치에 쓰고 취소돼 그날 보강이 0개였다.
        # 짧게 끊고 세 번 시도한다. 세 번 다 실패하면 그때는 진짜 실패다.
        timeout-minutes: 20
        run: |
          npm init -y >/dev/null
          for i in 1 2 3; do
            timeout 240 npm i --no-save playwright@1.49.1 && \
            timeout 300 npx playwright install --with-deps chromium && exit 0
            echo "설치 실패 — ${i}번째, 15초 후 재시도"
            sleep 15
          done
          echo "Playwright 설치가 세 번 다 실패했습니다"; exit 1
      - name: Collect
        env:
          # schedule 실행에는 inputs 가 없으므로 기본값을 여기서 채운다.
          GROUP: ${{ github.event.inputs.group || 'browser' }}
          BRANDS: ${{ github.event.inputs.brands }}
          STORE: ${{ github.event.inputs.store || '1' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '8' }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
        run: node scripts/browser-collect.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-collect-report
          path: |
            browser-collect-report.json
            browser-collect-report.md
          if-no-files-found: ignore
      - name: Commit report
        if: always()
        run: |
          git config user.name "collect-bot"
          git config user.email "collect-bot@users.noreply.github.com"
          rm -f package.json package-lock.json
          git add -A -- browser-collect-report.json browser-collect-report.md || true
          git commit -m "browser-collect: headless chrome results" || echo "no changes"
          # 리포트는 매번 통째로 새로 쓰이므로, 충돌하면 이번 실행 결과를 채택한다.
          for i in 1 2 3; do
            if git pull --rebase --autostash -X ours origin ${{ github.ref_name }}; then
              git push origin HEAD:${{ github.ref_name }} && exit 0
            else
              git rebase --abort || true
              git fetch origin ${{ github.ref_name }}
              git reset --soft origin/${{ github.ref_name }}
              git add -A -- browser-collect-report.json browser-collect-report.md
              git commit -m "browser-collect: headless chrome results" || true
            fi
            sleep 5
          done
          echo "::warning::report push failed after retries"
