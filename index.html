<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Board Scanner</title>
  <script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,700;1,6..96,500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    :root {
      --bg: #ffffff; --card: #f4f4f4; --card2: #ececec;
      --border: #d9d9d9; --text: #111111; --muted: #8a8a8a; --accent: #111111;
      --grad: linear-gradient(135deg, #3a3a3a 0%, #000000 100%);
    }
    body {
      font-family: "Bodoni Moda", "Apple SD Gothic Neo", "Malgun Gothic", "Times New Roman", serif;
      margin: 0; padding: 18px 16px 24px; color: var(--text); background: var(--bg);
    }
    h1 { font-size: 16px; margin: 0 0 4px; }
    h2 { font-size: 14px; margin: 14px 0 4px; }
    p.desc { font-size: 12px; color: var(--muted); margin: 0 0 14px; line-height: 1.55; }
    button {
      width: 100%; padding: 12px; font-size: 14px; font-weight: 700; color: var(--text);
      background: var(--card2); border: none; border-radius: 12px; cursor: pointer; font-family: inherit;
    }
    button:disabled { opacity: .5; cursor: default; }
    #run { background: #4262ff; color: #fff; }
    #downloadXlsx { background: #16a34a; color: #fff; margin-top: 8px; display: none; }
    #downloadCsv { background: #eef0f5; color: #333; margin-top: 6px; display: none; }
    /* (구 디자인의 #basicExport/#basicExportSel ID 규칙 제거 —
        ID 우선순위가 .scan 클래스를 덮어써 padding·margin(9px)·배경이 어긋났음) */
    .settings button { margin-top: 8px; }
    .settings { margin-top: 6px; font-size: 12px; color: var(--muted); }
    details.settings summary { cursor: pointer; user-select: none; color: var(--muted); }
    .settings label { display: block; margin: 12px 0 5px; font-weight: 700; color: var(--text); }
    .settings input, .settings textarea {
      width: 100%; padding: 11px 13px; font-size: 13px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--card); color: var(--text); font-family: inherit; resize: vertical;
    }
    .settings input:focus, .settings textarea:focus { outline: none; border-color: var(--accent); }
    .settings input::placeholder, .settings textarea::placeholder { color: var(--muted); }
    hr.sep { border: none; border-top: 1px solid #eee; margin: 20px 0 16px; }
    /* End Clothing 풍 미니멀 모바일 쇼핑 UI */
    .url-row { display: flex; gap: 6px; margin-top: 6px; }
    .url-row input { flex: 1; padding: 11px 15px; font-size: 13px; border: 1px solid #e2e2e2; border-radius: 26px; }
    .url-row input:focus { outline: none; border-color: #111; }
    .url-row .go { width: auto; padding: 0 16px; background: #111; color: #fff; border-radius: 26px; font-size: 15px; }
    /* 카테고리 탭: 가로폭에 맞게 가운데 정렬 + 박스 칩(모노 무드) */
    #importTabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
    #importTabs button {
      flex: 0 0 auto; width: auto; padding: 6px 12px; font-size: 10.5px; font-weight: 700;
      letter-spacing: 1.2px; text-transform: uppercase; white-space: nowrap; border-radius: 0;
      background: var(--bg); color: var(--muted); border: 1px solid var(--border); font-family: inherit;
    }
    #importTabs button.active { background: var(--text); color: var(--bg); border-color: var(--text); }
    #importHeader { display: none; }
    #importAdd { display: none !important; }   /* 하단 버튼 제거 → 툴바 EXPORT 아이콘으로 대체 */
    #importStatus { font-size: 12px; margin: 8px 0 4px; color: var(--muted); }
    /* 상품 카드 그리드 — Board Scanner와 동일(2열·얇은 간격·풀블리드 이미지+하단 블러 캡션) */
    #importGrid { display: none; grid-template-columns: repeat(2, 1fr); gap: 4px; margin-top: 12px; padding: 0 0 8px; }
    .imp-card { position: relative; aspect-ratio: 3 / 4; overflow: hidden; background: var(--card2); cursor: pointer; user-select: none; }
    .imp-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; cursor: grab; }
    .imp-card img:active { cursor: grabbing; }
    .imp-card.sel { outline: 3px solid var(--text); outline-offset: -3px; }
    .imp-card .chk { position: absolute; top: 7px; right: 7px; width: 18px; height: 18px; accent-color: #111; z-index: 3; pointer-events: none; }
    .imp-card .cap {
      position: absolute; left: 0; right: 0; bottom: 0; height: 60px; padding: 0 9px;
      display: flex; flex-direction: column; justify-content: center; pointer-events: none;
      background: rgba(24, 22, 20, .34); backdrop-filter: blur(9px) saturate(1.1);
      -webkit-backdrop-filter: blur(9px) saturate(1.1); border-top: 1px solid rgba(255, 255, 255, .14);
    }
    .imp-card .cap .b { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .imp-card .cap .b:empty { display: none; }
    .imp-card .cap .n { font-size: 9.5px; color: rgba(255, 255, 255, .85); line-height: 1.3; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .imp-card .cap .p { font-size: 10px; font-weight: 700; color: #fff; margin-top: 2px; }
    /* 카드 위 툴바: 선택 개수 + ALL·RESET·EXPORT 아이콘 */
    /* 선택 액션 바 — 스크롤과 무관하게 화면 하단에 상시 노출 */
    #importAdd { display: none !important; }   /* 하단 고정 바의 ⤴ 로 대체 */
    #importToolbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 9px 16px calc(9px + env(safe-area-inset-bottom, 0px));
      background: var(--bg); border-top: 1px solid var(--text); font-size: 11px;
      box-shadow: 0 -6px 14px rgba(0, 0, 0, .06);
    }
    #importCount { color: var(--text); font-weight: 600; letter-spacing: .3px; }
    .imp-actions { display: flex; gap: 8px; }
    .imp-actions .ib {
      width: 34px; height: 34px; padding: 0; border-radius: 50%; background: transparent;
      border: 1px solid var(--border); color: var(--text); display: flex; align-items: center; justify-content: center;
      font-family: inherit; font-size: 10px; font-weight: 800; letter-spacing: .5px;
    }
    .imp-actions .ib:hover { background: var(--card2); }
    .imp-actions .ib:disabled { opacity: .4; }
    .imp-actions .ib svg { width: 16px; height: 16px; display: block; }
    #status { font-size: 12px; margin: 14px 0 4px; min-height: 16px; color: var(--muted); }
    .summary {
      display: none; margin-top: 12px; font-size: 12px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: var(--muted);
    }
    .summary b { color: var(--accent); }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 11px; display: none; }
    th, td { text-align: left; padding: 8px 5px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text); }
    th { color: var(--muted); font-weight: 600; }
    td a { color: var(--accent); word-break: break-all; }
    td.imgcell { width: 64px; }
    .thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: var(--card2); display: block; }
    .ttl { font-weight: 600; margin-bottom: 3px; word-break: break-all; }
    .muted { color: var(--muted); }
    /* ── 탭(세그먼트) + 도움말 + 히어로 ── */
    .tabs-main { display: flex; gap: 4px; margin: 2px 0 16px; padding: 4px; background: var(--card); border-radius: 14px; }
    .mtab {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 4px; background: transparent; color: var(--muted); border-radius: 10px;
      font-size: 12px; font-weight: 700; letter-spacing: .2px;
    }
    .mtab .ic { font-size: 15px; line-height: 1; }
    .mtab.active { background: var(--card2); color: var(--text); }
    .hero { margin: 8px 0 18px; }
    .hero .k { font-size: 25px; font-weight: 800; letter-spacing: -.5px; color: var(--text); line-height: 1.1; }
    .hero .s { font-size: 12px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
    .help-line { display: flex; justify-content: flex-end; margin: -6px 0 8px; }
    .help-line button { width: auto; padding: 3px 11px; font-size: 11px; font-weight: 600; background: var(--card2); color: var(--muted); border-radius: 20px; }
    .help-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 12px; line-height: 1.7; color: var(--muted); margin-bottom: 12px; }
    .help-box b { color: var(--accent); }
    /* ── 스캔 버튼 + 도구(사용법·설정) 아이콘 + 팝오버 ── */
    /* 패널 전체를 세로 flex로: 위쪽(버튼·아이콘·상태)은 고정, 리스트만 남은 높이를 채워 스크롤 */
    #app { position: relative; height: 100%; display: flex; flex-direction: column; }
    #pane-extract { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
    .scan-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
    /* Vogue풍 모노크롬: 기본 흰 배경+얇은 검정 테두리, 활성(작업 중)만 검정 채움. */
    .scan-row > .scan { height: 96px; }
    .scan {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 9px; padding: 14px; border-radius: 2px; text-align: center;
      background: var(--bg); color: var(--text); border: 1px solid var(--text); box-shadow: none;
    }
    .scan .ic { display: flex; align-items: center; justify-content: center; width: 26px; height: 26px; flex: 0 0 26px; color: var(--text); }
    .scan.working .ic { color: #fff; }
    .scan .ic svg { width: 26px; height: 26px; display: block; }
    .scan .lab { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; line-height: 1.15; white-space: nowrap; }
    .scan #selCount { font-size: 11px; color: var(--accent); font-weight: 700; }
    /* 작업 중(활성): 검정 채움 + 은은한 흐름 애니메이션 */
    .scan.working {
      background-image: var(--grad); background-size: 220% 100%; color: #fff; border-color: #000;
      animation: scanFlow 1.2s linear infinite;
    }
    .scan.working .lab, .scan.working #selCount { color: #fff; }
    @keyframes scanFlow { 0% { background-position: 0% 50%; } 100% { background-position: 220% 50%; } }
    /* 검색바 (스캔 결과 필터) — Vogue 검색바 톤 */
    .searchbar { display: flex; align-items: center; gap: 11px; margin: 10px 0 0; padding: 11px 14px; border: 1px solid var(--border); background: var(--bg); }
    .searchbar .s-ic { width: 16px; height: 16px; flex: 0 0 16px; color: var(--text); }
    .searchbar input {
      flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--text);
      font-family: inherit; font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    }
    .searchbar input::placeholder { color: var(--muted); letter-spacing: 2px; }
    /* 사용법·설정·리셋 아이콘 줄 (검색바 아래, 가운데) */
    .tool-row { position: relative; display: flex; justify-content: center; gap: 12px; margin: 12px 0 2px; }
    .icobtn {
      width: 36px; height: 36px; padding: 0; border-radius: 50%; background: transparent; color: var(--text);
      border: 1px solid var(--border); font-size: 15px; display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .icobtn:hover { background: var(--card2); }
    .icobtn svg { width: 17px; height: 17px; display: block; }
    /* 아이콘에서 바로 펼쳐지는 팝오버(드롭다운) */
    .popover {
      position: absolute; top: 48px; left: 50%; transform: translateX(-50%);
      z-index: 100; width: 300px; max-width: calc(100vw - 32px);
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px; box-shadow: 0 12px 34px rgba(0, 0, 0, .16);
    }
    .popover::before {
      content: ''; position: absolute; top: -6px; left: 50%; margin-left: -6px; width: 12px; height: 12px;
      background: var(--card); border-left: 1px solid var(--border); border-top: 1px solid var(--border);
      transform: rotate(45deg); border-radius: 3px 0 0 0;
    }
    .pop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-size: 15px; font-weight: 800; color: var(--text); }
    .pop-head .x { width: auto; padding: 4px 8px; background: transparent; color: var(--muted); font-size: 15px; }
    .help-item { padding: 10px 0; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); line-height: 1.5; }
    .help-item b { display: block; color: var(--text); font-size: 13px; margin-bottom: 3px; }
    /* 검색바(스캔) 아래 한 줄 키워드 상태 */
    .scan-status { margin: 12px 2px 2px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .1px; min-height: 16px; }
    .scan-status b { color: var(--accent); font-weight: 800; }
    /* 인식된 리스트: 남은 높이를 모두 채우고 그 안에서 세로 스크롤 */
    .scan-list { margin-top: 12px; flex: 1 1 auto; min-height: 0; overflow-y: auto; border-radius: 12px; -webkit-overflow-scrolling: touch; }
    .scan-list::-webkit-scrollbar { width: 8px; }
    .scan-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    /* ── 스캔 결과: 2열 편집형 카드(이미지 풀블리드 + 하단 블러 캡션) ── */
    #preview.cards { display: none; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 0 0 8px; }
    .pcard { position: relative; overflow: hidden; background: var(--card2); aspect-ratio: 3 / 4; }
    .pcard.link { cursor: pointer; }
    .pcard-img { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .pcard-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pcard-img.noimg::after { content: '🧵'; font-size: 26px; opacity: .3; }
    /* 하단 블러(프로스트) 캡션 위에 브랜드·제품명 + 우측 사이트 이동 아이콘
       — 높이는 제목 길이와 무관하게 고정(모든 카드 동일), 브랜드/이름 위치도 고정 */
    .pcard-cap {
      position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px;
      height: 58px; padding: 0 9px; background: rgba(24, 22, 20, .30);
      backdrop-filter: blur(9px) saturate(1.1); -webkit-backdrop-filter: blur(9px) saturate(1.1);
      border-top: 1px solid rgba(255, 255, 255, .14);
    }
    .pcard-cap-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .cap-brand {
      height: 13px; font-size: 10px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .cap-name {
      height: 25px; font-size: 9.5px; letter-spacing: .3px; color: rgba(255, 255, 255, .82); margin-top: 2px; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .pcard-cap-go {
      flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; background: rgba(255, 255, 255, .92);
      color: #111; display: flex; align-items: center; justify-content: center; text-decoration: none;
    }
    .pcard-cap-go svg { width: 12px; height: 12px; display: block; }
    .pcard-more { grid-column: 1 / -1; text-align: center; font-size: 11px; color: var(--muted); padding: 8px 0 2px; letter-spacing: .5px; }
    /* ── 최상단 탭 (Vogue COLLECTIONS/COVERAGE 풍) ── */
    .topnav { display: flex; margin: 0 0 16px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
    .tnav {
      flex: 1; width: auto; padding: 8px 4px 12px; background: transparent; border-radius: 0;
      color: var(--muted); font-family: inherit; font-size: 12px; font-weight: 600;
      letter-spacing: 2.2px; text-transform: uppercase; white-space: nowrap;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tnav.active { color: var(--text); font-weight: 700; border-bottom-color: var(--text); }
    /* ── Market Research 팬 — Board Scanner와 동일 무드로 재스타일 ── */
    #pane-import { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 2px; padding-bottom: 64px; }
    #pane-import::-webkit-scrollbar { width: 8px; }
    #pane-import::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    /* 검색바(url-row) — image1 Board Scanner 검색바처럼 각진 박스 + 돋보기 왼쪽 */
    #pane-import .url-row { align-items: center; gap: 0; margin-top: 2px; border: 1px solid var(--text); background: var(--bg); }
    #pane-import .url-row:focus-within { border-color: var(--text); }
    #pane-import .url-row .go {
      width: auto; flex: 0 0 auto; padding: 0 8px 0 13px; background: transparent; color: var(--text);
      border-radius: 0; display: flex; align-items: center; justify-content: center;
    }
    #pane-import .url-row .go svg { width: 16px; height: 16px; display: block; }
    #pane-import .url-row input {
      flex: 1; min-width: 0; border: none; border-radius: 0; background: transparent; color: var(--text);
      font-family: inherit; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; padding: 11px 13px 11px 8px;
    }
    #pane-import .url-row input:focus { outline: none; }
    #pane-import .url-row input::placeholder { color: var(--muted); letter-spacing: 1px; }
    /* 필터 리셋(ALL) — 선택박스와 같은 높이의 각진 아이콘 버튼 */
    #pane-import .pick-reset {
      flex: 0 0 38px; width: 38px; padding: 0; display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; border-radius: 0;
    }
    #pane-import .pick-reset:hover { border-color: var(--text); }
    #pane-import .pick-reset svg { width: 15px; height: 15px; display: block; }
    /* 검색바 아래 브랜드·카테고리 선택 — 같은 각진 모노톤 무드 */
    #pane-import .pick-row { display: flex; gap: 6px; margin-top: 15px; }
    #pane-import .pick {
      flex: 1; min-width: 0; position: relative; display: flex; align-items: center;
      border: 1px solid var(--border); background: var(--bg);
    }
    #pane-import .pick:focus-within { border-color: var(--text); }
    #pane-import .pick-lab {
      position: absolute; left: 9px; top: -6px; padding: 0 4px; background: var(--bg);
      font-size: 8.5px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted);
    }
    #pane-import .pick select {
      width: 100%; border: none; background: transparent; color: var(--text); cursor: pointer;
      font-family: inherit; font-size: 11.5px; letter-spacing: .8px; text-transform: uppercase;
      padding: 10px 24px 10px 11px; appearance: none; -webkit-appearance: none; -moz-appearance: none;
      background: transparent; background-image: none;
      text-overflow: ellipsis; white-space: nowrap;
    }
    #pane-import .pick select:focus { outline: none; }
    #pane-import .pick select::-ms-expand { display: none; }   /* 화살표 이중 표시 방지 */
    #pane-import .pick select:disabled { color: var(--muted); cursor: default; }
    /* 검색바 + 브랜드/카테고리 = 상단 고정. 스크롤은 상품 목록만 내려간다. */
    #pane-import .mr-head {
      position: sticky; top: 0; z-index: 40; background: var(--bg);
      /* 라벨(pick-lab)이 박스 위로 6px 튀어나오므로 그만큼 위를 비워 잘리지 않게 한다 */
      padding: 8px 0 12px; margin-top: -8px;
      box-shadow: 0 6px 10px -8px rgba(0, 0, 0, .18);
    }
    #pane-import .mr-head .pick-row { margin-top: 15px; }
    #pane-import .pick::after {
      content: ''; position: absolute; right: 11px; width: 6px; height: 6px; pointer-events: none;
      border-right: 1.4px solid var(--text); border-bottom: 1.4px solid var(--text);
      transform: rotate(45deg) translate(-2px, -2px);
    }
  </style>
</head>
<body>
  <!-- 패널 UI (앱 아이콘 클릭 시 표시) -->
  <div id="app" style="display:none">
    <!-- 최상단 탭: Market Research ↔ Board Scanner -->
    <nav class="topnav">
      <button class="tnav" id="tabResearch">Market Research</button>
      <button class="tnav active" id="tabScanner">Board Scanner</button>
    </nav>

    <!-- Market Research (가져오기) -->
    <section class="tabpane" id="pane-import" style="display:none">
      <!-- 검색바와 브랜드·카테고리는 스크롤해도 위에 고정된다(상품만 내려감) -->
      <div class="mr-head">
      <div class="url-row">
        <button id="importFetch" class="go" title="검색" aria-label="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
        <input id="importBrandUrl" type="text" autocomplete="off" spellcheck="false"
          placeholder="Search products" />
      </div>

      <!-- 검색바 아래: 브랜드 · 카테고리 선택 -->
      <div class="pick-row">
        <label class="pick">
          <span class="pick-lab">Brand</span>
          <select id="pickBrand"><option value="">ALL</option></select>
        </label>
        <label class="pick">
          <span class="pick-lab">Category</span>
          <select id="pickCat"></select>
        </label>
        <button class="pick-reset" id="pickReset" title="브랜드·카테고리 필터를 ALL로 초기화" aria-label="필터 초기화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      </div>
      </div><!-- /mr-head -->


      <div id="cacheRow" style="display:none; flex-wrap:wrap; gap:4px; margin-top:8px"></div>
      <div id="importStatus"></div>
      <div id="importToolbar" style="display:none">
        <span id="importCount"></span>
        <span class="imp-actions">
          <button class="ib" id="importSelAll" title="이 탭 전체 선택" aria-label="전체 선택">ALL</button>
          <button class="ib" id="importSelNone" title="모든 선택 초기화" aria-label="선택 초기화"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
          <button class="ib" id="importExport" title="선택한 상품 보드에 추가" aria-label="보드에 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></button>
        </span>
      </div>
      <div id="importGrid"></div>
      <button id="importAdd">➕ 선택한 상품 보드에 추가</button>
    </section>

    <!-- Export (메인) -->
    <section id="pane-extract">
      <div class="scan-row">
        <button id="basicExport" class="scan"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 2.5 7.5 12 12.5l9.5-5L12 2.5Z"/><path d="M2.5 12 12 17l9.5-5"/><path d="M2.5 16.5 12 21.5l9.5-5"/></svg></span><span class="lab">Scan All</span></button>
        <button id="basicExportSel" class="scan"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="2.5" stroke-dasharray="3.6 3"/></svg></span><span class="lab">Scan Selected</span></button>
      </div>

      <!-- 스캔 결과 검색바 -->
      <div class="searchbar">
        <svg class="s-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="cardSearch" type="text" placeholder="Search" autocomplete="off" spellcheck="false" />
      </div>

      <!-- 검색바 아래 가운데: 사용법·리셋 아이콘 (설정은 기본값 내장 → 숨김) -->
      <div class="tool-row" id="toolRow">
        <button class="icobtn" id="helpBtn" aria-label="사용법" title="사용법">ⓘ</button>
        <button class="icobtn" id="resetBtn" aria-label="초기화" title="초기화(리셋)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>

        <!-- 사용법 팝오버 (ⓘ 아이콘) -->
        <div class="popover" id="helpModal" style="display:none">
          <div class="pop-head"><span>사용법</span><button class="x" id="helpClose" aria-label="닫기">✕</button></div>
          <div class="help-item"><b>📥 Scan All</b>보드의 링크된 이미지를 <b style="display:inline">전부</b> 엑셀로 — 브랜드·썸네일·URL·상품명. 컬러웨이·혼용률은 모든 브랜드에서 값이 채워질 때까지 열에서 뺐습니다. 값은 매일 새벽 미리 수집해 두므로 스캔은 <b style="display:inline">몇 초</b>면 끝납니다. 못 가져온 칸은 <b style="display:inline">확인 필요</b>로 표시됩니다.</div>
          <div class="help-item"><b>🖱 Scan Selected</b>보드에서 <b style="display:inline">클릭·Shift+클릭·마우스 박스 드래그</b>로 선택한 이미지만 엑셀로. 선택하면 개수가 표시됩니다.</div>
          <div class="help-item"><b>↺ 리셋</b>스캔 결과·상태를 지우고 처음으로 되돌립니다.</div>
        </div>
      </div>

      <!-- 서버 주소·토큰은 기본값이 내장되어 유저에게 노출하지 않음(JS만 참조하는 숨김 입력) -->
      <div style="display:none" aria-hidden="true">
        <input id="workerUrl" type="url" />
        <input id="accessToken" type="text" />
        <input id="renderUrl" type="url" />
      </div>

      <div class="scan-status" id="status"></div>
      <div class="summary" id="summary" style="display:none"></div>

      <div class="scan-list">
        <div id="preview" class="cards"></div>
      </div>
    </section>
  </div>

  <script>
    // 이 파일 하나가 두 가지 역할을 합니다.
    //  - ?view=panel  → 오른쪽에 뜨는 패널 UI
    //  - 그 외        → 보드 로딩 시 실행되는 앱 진입점(아이콘 클릭 등록)
    const params = new URLSearchParams(location.search);

    // 원단 분석 서버(Worker)를 이미지 프록시로도 사용 → 남의 도메인 이미지 CORS 우회.
    // (initPanel()보다 먼저 선언돼야 함 — 안 그러면 TDZ 오류로 패널 스크립트 전체가 멈춥니다.)
    let __proxy = { url: '', token: '' };
    let __boardId = ''; // 미로 REST API로 보드 이미지를 받아올 때 필요(썸네일용).
    let __render = '';  // ① 가져오기용 Render 서버 주소.
    let __imgCache = {}; // 보드에 추가한 이미지의 원본 URL 기억 { itemId: imageUrl } — 엑셀 썸네일용(토큰 불필요).

    if (params.get('view') === 'panel') {
      initPanel();
    } else {
      // 앱 URL에 ?worker=<주소> (선택 ?atoken=) 를 넣어두면, 팀원은 아무 설정 없이 바로 씀.
      // 그 값을 패널로 그대로 전달(openPanel은 새 로드라 파라미터를 이어줘야 함).
      const passthru = ['worker', 'atoken', 'render'].map(k => {
        const v = params.get(k);
        return v ? '&' + k + '=' + encodeURIComponent(v) : '';
      }).join('');
      miro.board.ui.on('icon:click', async () => {
        // v=타임스탬프로 매번 새 URL을 만들어 브라우저 캐시를 우회합니다.
        await miro.board.ui.openPanel({ url: 'index.html?view=panel&v=' + Date.now() + passthru });
      });
    }

    function initPanel() {
      document.getElementById('app').style.display = 'flex';   // 세로 flex 레이아웃(리스트 스크롤용)

      // 기타 도구 버튼은 UI에서 제거됨. 공유 함수(collectRows/buildBasicXlsx)가
      // 참조하는 disabled/style/addEventListener만 무해하게 받아주는 스텁으로 대체(널 오류 방지).
      const _stubBtn = () => ({ disabled: false, style: {}, addEventListener() {} });
      const runBtn = _stubBtn();
      const xlsxBtn = _stubBtn();
      const csvBtn = _stubBtn();
      const workerUrlEl = document.getElementById('workerUrl');
      const accessTokenEl = document.getElementById('accessToken');
      const statusEl = document.getElementById('status');
      const summaryEl = document.getElementById('summary');
      const table = document.getElementById('preview');   // 이제 3열 카드 그리드(div)
      const tbody = table;                                 // 카드는 이 컨테이너에 직접 append

      let rows = [];

      // ── 상단 아이콘: 설정/사용법 팝오버(아이콘에서 펼쳐지는 드롭다운) ──────
      // Board Scanner: settingsModal/helpModal · Market Research: mrSettingsModal/mrHelpModal
      const popIds = ['settingsModal', 'helpModal', 'mrSettingsModal', 'mrHelpModal'];
      const closeAllPops = () => popIds.forEach(id => { const m = document.getElementById(id); if (m) m.style.display = 'none'; });
      const openModal = (id) => {
        const m = document.getElementById(id); if (!m) return;
        const wasOpen = m.style.display === 'block';
        closeAllPops();
        if (!wasOpen) m.style.display = 'block';   // 같은 아이콘 다시 누르면 닫힘(토글)
      };
      const closeModal = (m) => { if (m) m.style.display = 'none'; };
      function openSettings() { openModal('settingsModal'); }
      // 아이콘 → 팝오버 토글, 닫기(✕) 버튼 배선 (양쪽 탭 동일 UI)
      [
        ['settingsBtn', 'settingsModal'], ['helpBtn', 'helpModal'],
        ['mrSettingsBtn', 'mrSettingsModal'], ['mrHelpBtn', 'mrHelpModal'],
      ].forEach(([btn, modal]) => {
        const b = document.getElementById(btn);
        if (b) b.addEventListener('click', (e) => { e.stopPropagation(); openModal(modal); });
      });
      [['settingsClose', 'settingsModal'], ['helpClose', 'helpModal'],
       ['mrSettingsClose', 'mrSettingsModal'], ['mrHelpClose', 'mrHelpModal']].forEach(([x, modal]) => {
        const c = document.getElementById(x);
        if (c) c.addEventListener('click', () => closeModal(document.getElementById(modal)));
      });
      // 바깥(아이콘·팝오버 밖) 클릭 시 닫기
      document.addEventListener('click', (e) => {
        if (e.target.closest('.popover') || e.target.closest('.icobtn')) return;
        closeAllPops();
      });
      // 하위호환: 기존 코드의 showTab('settings') 호출은 설정 팝오버를 연다.
      // 설정 팝오버는 Board Scanner 팬 안에 있으므로, 먼저 그 탭으로 전환 후 연다.
      // (버튼 클릭 흐름에서 불려도 바깥클릭 리스너에 즉시 닫히지 않도록 다음 틱에 연다.)
      function showTab(name) { if (name === 'settings') { switchPane('scanner'); setTimeout(openSettings, 0); } }

      // ── 최상단 탭: Market Research ↔ Board Scanner ──────────────────
      const paneImportEl = document.getElementById('pane-import');
      const paneExtractEl = document.getElementById('pane-extract');
      const tabResearchEl = document.getElementById('tabResearch');
      const tabScannerEl = document.getElementById('tabScanner');
      function switchPane(name) {
        const research = name === 'research';
        paneImportEl.style.display = research ? 'block' : 'none';
        paneExtractEl.style.display = research ? 'none' : 'flex';   // extract 팬은 flex 컬럼
        tabResearchEl.classList.toggle('active', research);
        tabScannerEl.classList.toggle('active', !research);
        closeAllPops();
        // 하단 고정 선택바는 Market Research 탭에서, 결과가 있을 때만 노출.
        const tb = document.getElementById('importToolbar');
        if (tb) tb.style.display = (research && importItems.length) ? 'flex' : 'none';
        if (research) { try { loadBrandList(); loadCatalogChips(); } catch (e) {} }
      }
      tabResearchEl.addEventListener('click', () => switchPane('research'));
      tabScannerEl.addEventListener('click', () => switchPane('scanner'));

      // 보드 ID를 미리 확보하고, 이 보드에서 예전에 추가한 이미지 URL 캐시를 불러옴.
      (async () => {
        try { const info = await miro.board.getInfo(); __boardId = (info && info.id) || ''; } catch (e) {}
        try { __imgCache = JSON.parse(localStorage.getItem('rackImgCache:' + __boardId) || '{}'); } catch (e) {}
      })();
      // 보드에 추가한 상품의 정보(이미지URL·이름·가격·브랜드·상품URL)를 기억 → 엑셀에 그대로 사용(API 불필요).
      function cacheImg(id, rec) {
        if (!id || !rec || !rec.imageUrl) return;
        __imgCache[id] = {
          imageUrl: rec.imageUrl, name: rec.name || '', price: rec.price || '',
          priceOrig: rec.priceOrig || '', comp: rec.comp || '',
          color: rec.color || '', sizes: rec.sizes || '',
          brand: rec.brand || '', productUrl: rec.productUrl || '', category: rec.category || '',
        };
        try { localStorage.setItem('rackImgCache:' + __boardId, JSON.stringify(__imgCache)); } catch (e) {}
      }
      function normalizeRec(v) { return !v ? null : (typeof v === 'string' ? { imageUrl: v } : v); }
      // 평문 http:// 주소는 Akamai 등이 "Access Denied"로 막는다(브라우저가 그 주소로 직접 이동).
      // 쇼핑몰은 사실상 전부 https라, 링크를 열거나 내보낼 때 https로 올려준다.
      function httpsUrl(u) {
        const s = String(u || '').trim();
        return /^http:\/\//i.test(s) ? s.replace(/^http:\/\//i, 'https://') : s;
      }
      // 혼용률은 원단이 둘이면 줄이 나뉜다. 보드 캡션은 한 줄이므로 ' | ' 로 잇고,
      // 다시 읽을 때 되돌린다.
      const compToTitle = (s) => String(s || '').split('\n').map(x => x.trim()).filter(Boolean).join(' | ');
      const compFromTitle = (s) => String(s || '').split('|').map(x => x.trim()).filter(Boolean).join('\n');

      // 보드에 놓을 이미지의 캡션. "브랜드 · 이름 · $가격 · Cotton 95% / Elastane 5%".
      // 혼용률은 validComp 를 통과할 때만 붙인다 — 반쪽짜리("Cotton 60%")가 캡션에
      // 박히면 보드에서 일일이 지워야 한다. 캡션에 넣어 두면 localStorage 캐시가 없는
      // 다른 PC에서 스캔해도 혼용률이 그대로 살아난다(아래 parseTitle 이 되읽는다).
      function boardTitle(it) {
        const parts = [];
        if (it.brand) parts.push(it.brand);
        if (it.name) parts.push(it.name);
        if (it.price) parts.push(it.price);
        const c = cleanVal(it.comp);
        if (validComp(c)) parts.push(compToTitle(c));
        return parts.join(' · ');
      }

      // 캐시가 없는 이미지는 제목("브랜드 · 이름 · $가격 · 혼용률")에서 최대한 뽑음.
      function parseTitle(t) {
        const parts = (t || '').split('·').map(s => s.trim()).filter(Boolean);
        let price = '', comp = '', names = [];
        parts.forEach(p => {
          if (/[$€£₩]\s?\d/.test(p)) { price = p; return; }
          const c = compFromTitle(p);
          if (validComp(c)) { comp = c; return; }   // 혼용률 조각은 이름이 아니다
          names.push(p);
        });
        return { name: names.length > 1 ? names.slice(1).join(' · ') : (names[0] || ''), price, comp };
      }

      // ── 상품 사진을 보드로 드래그앤드롭 → 그 위치에 이미지+링크 생성 ──
      // (Miro Web SDK: .miro-draggable 이미지가 보드에 드롭되면 'drop' 이벤트로 좌표를 받음)
      try {
        miro.board.ui.on('drop', async ({ x, y, target }) => {
          if (!(target instanceof HTMLImageElement) || !target.classList.contains('miro-draggable')) return;
          const card = target.closest('.imp-card');
          const dragged = card ? importItems.find(i => String(i.id) === card.dataset.id) : null;
          // 끌어놓은 상품이 "선택된 상태 + 다중 선택"이면 선택 전체를 함께 드롭. 아니면 그것 하나만.
          let batch;
          if (dragged && dragged.selected && importItems.filter(i => i.selected).length > 1) {
            batch = importItems.filter(i => i.selected);
          } else if (dragged) {
            batch = [dragged];
          } else {
            batch = [{ imageUrl: target.dataset.full || target.src, productUrl: target.dataset.link || '', name: target.dataset.title || '', brand: '', comp: target.dataset.comp || '' }];
          }
          // 이미지 크기 = 현재 보드 화면 폭의 약 10% (줌 상태와 무관하게 보기 좋은 크기)
          let W = 240;
          try { const vp = await miro.board.viewport.get(); W = Math.min(Math.max(Math.round(vp.width * 0.10), 120), 2400); } catch (e) {}
          const gapX = W * 0.14, gapY = W * 1.5, cols = Math.min(batch.length, 4);
          for (let i = 0; i < batch.length; i++) {
            const it = batch[i], col = i % cols, row = Math.floor(i / cols);
            try {
              // 첫 이미지(끌어놓은 것)의 중심이 커서(x,y)에 오도록. 나머지는 그 옆/아래로.
              const img = await createBoardImage(it, {
                x: x + col * (W + gapX), y: y + row * gapY, width: W,
                title: boardTitle(it),
              });
              if (it.productUrl) { img.linkedTo = httpsUrl(it.productUrl); await img.sync(); }
              cacheImg(img.id, it);   // 엑셀용으로 이미지URL·이름·가격·브랜드 기억
            } catch (e) {}
          }
        });
      } catch (e) {}

      // 서버 설정을 브라우저에 기억(팀원마다 1회만 입력).
      const renderUrlEl = document.getElementById('renderUrl'); // Market Research 서버 주소(설정 팝오버)
      const syncProxy = () => {
        __proxy = { url: (workerUrlEl.value || '').trim(), token: (accessTokenEl.value || '').trim() };
        __render = (renderUrlEl ? (renderUrlEl.value || '') : (localStorage.getItem('importRenderUrl') || '')).trim().replace(/\/+$/, '');
      };
      // 무설정 사용을 위한 기본값(내장). 우선순위: 저장값 > 앱URL 파라미터 > 내장 기본값.
      // → 팀원은 앱만 설치하면 아무것도 입력하지 않아도 바로 동작.
      const DEFAULTS = {
        worker: 'https://fabric-extractor.hs-fabric-linker.workers.dev',
        atoken: 'hsfabriclinker',
        render: 'https://market-research-uzs2.onrender.com',
      };
      const defWorker = (params.get('worker') || '').trim() || DEFAULTS.worker;
      const defAToken = (params.get('atoken') || '').trim() || DEFAULTS.atoken;
      const defRender = (params.get('render') || '').trim() || DEFAULTS.render;
      try {
        if (renderUrlEl) renderUrlEl.value = localStorage.getItem('importRenderUrl') || defRender;
        workerUrlEl.value = localStorage.getItem('fabricWorkerUrl') || defWorker;
        accessTokenEl.value = localStorage.getItem('fabricAccessToken') || defAToken;
      } catch (e) {}
      syncProxy();
      if (renderUrlEl) renderUrlEl.addEventListener('change', () => {
        try { localStorage.setItem('importRenderUrl', renderUrlEl.value.trim()); } catch (e) {}
        syncProxy();
        loadBrandList();
      });
      workerUrlEl.addEventListener('change', () => {
        try { localStorage.setItem('fabricWorkerUrl', workerUrlEl.value.trim()); } catch (e) {}
        syncProxy();
        loadCatalogChips();
      });
      accessTokenEl.addEventListener('change', () => {
        try { localStorage.setItem('fabricAccessToken', accessTokenEl.value.trim()); } catch (e) {}
        syncProxy();
      });

      // 원단 AI 분석 기능은 제거됨(무료·범용 원칙). 공유 함수들이 참조하는 disabled만 받아주는 스텁.
      const heroBtn = { disabled: false };

      // ── 📥 기본 추출: 브랜드·썸네일·상품명·URL + 야간 수집분의 컬러웨이·혼용률. 전체 / 선택한 것만 두 모드. ──
      const basicBtn = document.getElementById('basicExport');
      const basicSelBtn = document.getElementById('basicExportSel');
      async function runBasicExport(selectedOnly) {
        if (!(workerUrlEl.value || '').trim()) {
          showTab('settings');
          statusEl.textContent = '썸네일을 엑셀에 넣으려면 ⚙ 설정에 ② 추출 Worker 주소가 필요합니다 (최초 1회).';
          return;
        }
        const activeBtn = selectedOnly ? basicSelBtn : basicBtn;
        basicBtn.disabled = true; basicSelBtn.disabled = true; heroBtn.disabled = true;
        activeBtn.classList.add('working');   // 작업 중: 그라데이션 흐름 애니메이션
        try {
          await collectRows(selectedOnly);
          if (!rows.length) return;
          await enrichNames();   // URL로만 추정한 이름을 실제 페이지 제목(og:title)으로 보강
          await buildBasicXlsx();
        } catch (e) {
          statusEl.textContent = '오류: ' + ((e && e.message) || e);
        } finally {
          activeBtn.classList.remove('working');
          basicBtn.disabled = false; basicSelBtn.disabled = false; heroBtn.disabled = false;
        }
      }
      basicBtn.addEventListener('click', () => runBasicExport(false));
      basicSelBtn.addEventListener('click', () => runBasicExport(true));

      // ── 상품명 보강: URL 추정 이름을 Worker의 무료 og:title 조회로 교체 ──
      const __titleCache = {};   // link → 정제된 제목 (같은 세션 내 재조회 방지)
      function cleanTitle(t, brand) {
        let s = String(t || '').replace(/\s+/g, ' ').trim();
        // "상품명 | 브랜드", "상품명 – 브랜드" 꼬리 제거
        s = s.split(' | ')[0].split(' — ')[0].split(' – ')[0].trim();
        if (brand) {
          const esc = brand.replace(/[.*+?^${}()[\]\\]/g, '\\$&');
          s = s.replace(new RegExp('\\s*[-·|]\\s*' + esc + '\\s*$', 'i'), '')
               .replace(new RegExp('^' + esc + '\\s*[-·|]\\s*', 'i'), '').trim();
        }
        return s.slice(0, 120);
      }
      // 야간 수집이 만들어 둔 전체 상품 인덱스(수만 건)에서 같은 URL 을 찾아
      // 이름·가격·정가·브랜드를 채운다. 네트워크는 인덱스 1회 로드가 전부라
      // 상품이 몇 개든 시간이 늘지 않는다 — 상품 페이지 접속과는 완전히 다른 비용이다.
      const urlKey = (u) => {
        try {
          const x = new URL(u);
          return (x.hostname.replace(/^www\./, '') + x.pathname.replace(/\/+$/, '')).toLowerCase();
        } catch (e) { return ''; }
      };
      async function fillFromCatalogs() {
        const miss = rows.filter((r) => r.link && (!r.comp || !r.sizes || !r.color));
        if (!miss.length || !__proxy.url) return;
        const base = __proxy.url.replace(/\/+$/, '');
        const tok = __proxy.token ? '&token=' + encodeURIComponent(__proxy.token) : '';
        let listData;
        try { listData = await (await fetch(base + '/?catalogs=1' + tok)).json(); } catch (e) { return; }
        const cats = (listData && listData.list) || [];
        const byHost = new Map();
        for (const r of miss) {
          try { byHost.set(new URL(r.link).hostname.replace(/^www\./, '').toLowerCase(), true); } catch (e) {}
        }
        let filled = 0;
        for (const host of byHost.keys()) {
          const sites = cats.filter((c) => String(c.site || '').toLowerCase().startsWith(host)).slice(0, 3);
          for (const c of sites) {
            // 야간 보강이 채워 둔 오버레이(상품URL → 혼용률·컬러·사이즈·가격).
            // 카탈로그 본문보다 훨씬 작아서 브랜드당 한 번의 가벼운 요청이면 된다.
            let om;
            try { om = await (await fetch(base + '/?comps=' + encodeURIComponent(c.site) + tok)).json(); }
            catch (e) { continue; }
            const map = new Map();
            for (const [u, o] of Object.entries(om || {})) if (o) map.set(urlKey(u), o);
            for (const r of miss) {
              const o = map.get(urlKey(r.link));
              if (!o) continue;
              if (!r.comp && o.comp) { r.comp = o.comp; filled++; }
              if (!r.color && o.color) r.color = o.color;
              if (!r.sizes && o.sizes) r.sizes = o.sizes;
              if (!r.price && o.price) r.price = o.price;
              if (!r.priceOrig && o.priceOrig) r.priceOrig = o.priceOrig;
            }
          }
        }
        if (filled) statusEl.textContent = `상품 정보 ${filled}건을 야간 수집분에서 보강`;
      }

      async function fillFromIndex() {
        const want = rows.filter((r) =>
          r.link && (!r.name || r.nameFromUrl || !r.price || !r.comp || !r.color || !r.sizes));
        if (!want.length || !__proxy.url) return;
        let idx;
        try { idx = await ensureIndex(); } catch (e) { return; }
        if (!idx || !idx.length) return;
        const byUrl = new Map();
        for (const it of idx) {
          const k = urlKey(it.productUrl);
          if (k && !byUrl.has(k)) byUrl.set(k, it);
        }
        let hit = 0;
        for (const r of want) {
          const it = byUrl.get(urlKey(r.link));
          if (!it) continue;
          hit++;
          if (!r.name || r.nameFromUrl) { if (it.name) { r.name = it.name; r.nameFromUrl = false; } }
          if (!r.price && it.price) r.price = it.price;
          if (!r.priceOrig && it.priceOrig) r.priceOrig = it.priceOrig;
          if (!r.comp && it.comp) r.comp = it.comp;
          if (!r.color && it.color) r.color = it.color;
          if (!r.sizes && it.sizes) r.sizes = it.sizes;
          if (!r.brand && it.brand) r.brand = it.brand;
        }
        if (hit) statusEl.textContent = `저장된 상품 정보에서 ${hit}건 보강`;
      }

      async function enrichNames() {
        if (!__proxy.url) return;
        const targets = rows.filter(r => r.link && r.nameFromUrl);
        if (!targets.length) return;
        const base = __proxy.url.replace(/\/+$/, '');
        const tok = __proxy.token ? '&token=' + encodeURIComponent(__proxy.token) : '';
        let done = 0;
        const queue = targets.slice();
        const workers = Array.from({ length: Math.min(5, queue.length) }, async () => {
          while (queue.length) {
            const r = queue.shift();
            try {
              let title = __titleCache[r.link];
              if (title === undefined) {
                const ctl = new AbortController();
                const timer = setTimeout(() => ctl.abort(), 8000);   // 느린 사이트는 8초에서 포기(다음으로)
                const resp = await fetch(base + '/?meta=' + encodeURIComponent(r.link) + tok, { signal: ctl.signal });
                clearTimeout(timer);
                const data = await resp.json().catch(() => null);
                title = cleanTitle(data && data.title, r.brand);
                __titleCache[r.link] = title;
              }
              if (title) { r.name = title; r.nameFromUrl = false; }
            } catch (e) {}
            done++;
            statusEl.innerHTML = `상품명 확인 중… <b>${done}</b>/${targets.length}`;
          }
        });
        await Promise.all(workers);
        renderPreview();
      }

      // ── 검색바: 스캔된 카드들을 브랜드/제품명으로 필터 ──
      let cardFilter = '';
      const cardSearchEl = document.getElementById('cardSearch');
      if (cardSearchEl) cardSearchEl.addEventListener('input', () => {
        cardFilter = cardSearchEl.value || '';
        if (rows.length) renderPreview();
      });

      // ── ↺ 초기화(리셋): 스캔 결과·상태·활성표시·검색어를 모두 비움 ──
      const resetBtn = document.getElementById('resetBtn');
      function resetPanel() {
        rows = [];
        cardFilter = '';
        if (cardSearchEl) cardSearchEl.value = '';
        tbody.innerHTML = '';
        table.style.display = 'none';
        summaryEl.style.display = 'none';
        summaryEl.innerHTML = '';
        statusEl.innerHTML = '';
        basicBtn.classList.remove('working');
        basicSelBtn.classList.remove('working');
      }
      if (resetBtn) resetBtn.addEventListener('click', resetPanel);

      // ── 📥 상품 가져오기: 브랜드 → Render 서버(133 브랜드) → 미리보기 → 선택 → 보드에 추가 ──
      const importBrandUrlEl = document.getElementById('importBrandUrl');
      const importFetchBtn = document.getElementById('importFetch');
      const importAddBtn = document.getElementById('importAdd');
      const importStatusEl = document.getElementById('importStatus');
      const importGridEl = document.getElementById('importGrid');
      const importTabsEl = { style: {}, innerHTML: '', appendChild() {} };   // 탭 UI 제거 — 카테고리는 드롭다운으로 일원화
      const importToolbarEl = document.getElementById('importToolbar');
      const importCountEl = document.getElementById('importCount');
      const importSelAllBtn = document.getElementById('importSelAll');
      const importSelNoneBtn = document.getElementById('importSelNone');
      const pickBrandEl = document.getElementById('pickBrand');
      const pickCatEl = document.getElementById('pickCat');

      const IMPORT_CATS = [
        { key: 'new', label: 'New' }, { key: 'tops', label: 'Tops' },
        { key: 'sweatshirts', label: 'Sweat' }, { key: 'shirts', label: 'Shirts' },
        { key: 'dresses', label: 'Dresses' }, { key: 'pants', label: 'Pants' },
      ];
      let importItems = [];      // 서버가 준 상품들 { id,name,category,imageUrl,productUrl,price,brand,selected }
      let importCat = 'tops';    // 현재 보고 있는 카테고리 탭
      let wantCat = '';          // 검색바에서 "브랜드 · 카테고리"로 고른 카테고리(있으면 그 탭을 염)
      let importBrand = '';
      let importBrands = [];     // 서버가 준 브랜드 목록 [{name,url,categories}] — 이름→URL 변환용
      const CAT_SEP = ' · ';     // 검색바 "브랜드 · 카테고리" 구분자

      // "Aritzia · Pants" → { text:'Aritzia', cat:'pants' }. 카테고리가 없으면 cat:''.
      function splitBrandCat(input) {
        const i = input.lastIndexOf(CAT_SEP);
        if (i < 0) return { text: input, cat: '' };
        const tail = input.slice(i + CAT_SEP.length).trim().toLowerCase();
        const hit = IMPORT_CATS.find(c => c.label.toLowerCase() === tail || c.key === tail);
        return hit ? { text: input.slice(0, i).trim(), cat: hit.key } : { text: input, cat: '' };
      }

      // ── 검색바 = 상품명 검색 (브랜드·카테고리 필터와 독립) ──
      // 브랜드가 선택돼 있으면 그 결과 안에서, ALL이면 전체 스캔 인덱스에서 제목으로 찾는다.
      let titleQuery = '';
      let loadedBrandMode = false;   // true = 특정 브랜드 카탈로그가 로드된 상태
      let __searchIndex = null;      // 전체 상품 인덱스(최초 전역 검색 때 1회 로드)

      async function ensureIndex() {
        if (__searchIndex) return __searchIndex;
        const base = __proxy.url.replace(/\/+$/, '');
        const tok = __proxy.token ? '&token=' + encodeURIComponent(__proxy.token) : '';
        const resp = await fetch(base + '/?index=1' + tok);
        const data = await resp.json().catch(() => ({}));
        __searchIndex = Array.isArray(data.items) ? data.items : [];
        return __searchIndex;
      }

      async function globalTitleSearch() {
        const q = titleQuery;
        if (q.length < 2) {
          importItems = []; importGridEl.style.display = 'none'; importTabsEl.style.display = 'none';
          importToolbarEl.style.display = 'none'; importAddBtn.style.display = 'none';
          importStatusEl.textContent = q ? '두 글자 이상 입력하세요.' : '';
          return;
        }
        try {
          const idx = await ensureIndex();
          const hits = idx.filter(it => (it.name || '').toLowerCase().includes(q)).slice(0, 300);
          loadedBrandMode = false;
          importBrand = '';
          importItems = hits.map((it, i) => ({
            id: 'g' + i, name: it.name || '', category: guessCat(it.productUrl, it.name),
            imageUrl: it.imageUrl, productUrl: it.productUrl, price: it.price || '',
            priceOrig: it.priceOrig || '', comp: it.comp || '',
            color: it.color || '', sizes: it.sizes || '', brand: it.brand || '', selected: false,
          })).filter(it => it.imageUrl && it.productUrl);
          if (!importItems.length) { showNoResult(); return; }
          importStatusEl.textContent = '';
          importCat = '';   // ALL — 전 카테고리 표시
          renderImportTabs(); renderImportGrid();
        } catch (e) {
          importStatusEl.textContent = '검색 실패: ' + ((e && e.message) || e);
        }
      }

      function applySearch() {
        titleQuery = importBrandUrlEl.value.trim().toLowerCase();
        if (loadedBrandMode && importItems.length) {
          // 브랜드 결과 안에서 제목 필터(visibleItems/catCount가 titleQuery를 반영)
          renderImportTabs(); renderImportGrid();
        } else {
          globalTitleSearch();
        }
      }
      let __tqTimer = null;
      importBrandUrlEl.addEventListener('input', () => {
        clearTimeout(__tqTimer);
        __tqTimer = setTimeout(applySearch, 300);
      });
      importBrandUrlEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); clearTimeout(__tqTimer); applySearch(); }
      });

      // 브랜드 목록을 서버에서 받아 선택박스에 채움.
      async function loadBrandList() {
        if (!__render) return;
        try {
          const resp = await fetch(__render + '/api/brands');
          const data = await resp.json();
          importBrands = (data.brands || []).filter(b => b && b.name && b.url);
          fillBrandPicker();
        } catch (e) {
          if (pickBrandEl && !importBrands.length) {
            pickBrandEl.innerHTML = '<option value="">ALL</option>';
          }
        }
      }

      // ── 검색바 아래 브랜드·카테고리 선택 UI ──
      function fillBrandPicker() {
        if (!pickBrandEl) return;
        const cur = pickBrandEl.value;
        pickBrandEl.innerHTML = '<option value="">ALL</option>' +
          importBrands.map(b => `<option value="${escapeHtml(b.name)}">${escapeHtml(b.name)}</option>`).join('');
        if (cur) pickBrandEl.value = cur;
      }
      // 카테고리 옵션: 브랜드마다 다르게.
      //  · 검색 전 — 선택한 브랜드가 실제 보유한 카테고리만 표시(/api/brands의 categories).
      //  · 검색 후 — 실제 수집 개수를 붙이고 0개는 비활성.
      function fillCatPicker() {
        if (!pickCatEl) return;
        const loaded = importItems.length > 0;
        let cats = IMPORT_CATS;
        if (!loaded && pickBrandEl && pickBrandEl.value) {
          const b = importBrands.find(x => x.name === pickBrandEl.value);
          // 카테고리 정보가 있는 브랜드만 좁힘(없으면 전체 유지 — 서버가 자동 탐색하는 브랜드).
          if (b && Array.isArray(b.categories) && b.categories.length) {
            cats = IMPORT_CATS.filter(c => c.key === 'new' || b.categories.includes(c.key));
          }
        }
        // 숫자 없이 카테고리 이름만. 로드된 상태에서 0개인 카테고리는 비활성.
        pickCatEl.innerHTML = '<option value="">ALL</option>' + cats.map(c => {
          const dis = loaded && !catCount(c.key) ? ' disabled' : '';
          return `<option value="${c.key}"${dis}>${c.label}</option>`;
        }).join('');
        const want = loaded ? importCat : wantCat;
        pickCatEl.value = (want && cats.some(c => c.key === want)) ? want : '';
      }
      if (pickBrandEl) {
        // 브랜드 = 필터. 고르면 곧바로 그 브랜드 결과 표시, ALL이면 전역 제목검색 상태로.
        pickBrandEl.addEventListener('change', () => {
          const name = pickBrandEl.value;
          fillCatPicker();
          if (name) { runBrandFetch(name); }
          else {
            loadedBrandMode = false;
            if (titleQuery) globalTitleSearch();
            else {
              importItems = []; importGridEl.style.display = 'none'; importTabsEl.style.display = 'none';
              importToolbarEl.style.display = 'none'; importAddBtn.style.display = 'none';
              importStatusEl.textContent = '';
            }
          }
        });
      }
      if (pickCatEl) {
        // 카테고리 = 필터. ALL이면 전 카테고리, 아니면 그 카테고리만.
        pickCatEl.addEventListener('change', () => {
          const key = pickCatEl.value;
          wantCat = key;
          if (importItems.length) {
            importCat = key;   // '' = ALL
            renderImportTabs();
            renderImportGrid();
          } else if (pickBrandEl && pickBrandEl.value) {
            runBrandFetch(pickBrandEl.value);
          } else if (titleQuery) {
            globalTitleSearch();
          }
        });
      }
      // ↺ 리셋: 브랜드·카테고리를 ALL로 (검색어는 유지 — 있으면 전역 검색으로 전환)
      const pickResetBtn = document.getElementById('pickReset');
      if (pickResetBtn) {
        pickResetBtn.addEventListener('click', () => {
          if (pickBrandEl) pickBrandEl.value = '';
          wantCat = ''; importCat = '';
          loadedBrandMode = false;
          fillCatPicker();
          if (titleQuery) { globalTitleSearch(); }
          else {
            importItems = []; importGridEl.style.display = 'none'; importTabsEl.style.display = 'none';
            importToolbarEl.style.display = 'none'; importAddBtn.style.display = 'none';
            importStatusEl.textContent = '';
          }
        });
      }
      // 돋보기 버튼 = 제목 검색 실행(검색바와 동일)
      importFetchBtn.addEventListener('click', () => { clearTimeout(__tqTimer); applySearch(); });

      // 브랜드 카탈로그 로드(선택박스에서 브랜드를 고르면 실행)
      async function runBrandFetch(raw) {
        const typed = (raw || '').trim();
        if (!typed) return;
        wantCat = pickCatEl ? pickCatEl.value : '';

        // ① 먼저 팀 저장소(야간 프리페치 + 확장 수집본)에서 이 브랜드를 찾음.
        //    36시간 이내 저장본이면 그대로 즉시 표시(콜드스타트·75초 수집 대기 없음).
        //    서버 수집이 불가능한 브랜드는 오래된 저장본이라도 즉시 표시.
        //    그 외에는 실시간 수집을 먼저 시도하고, 실패하면 저장본으로 폴백.
        const bInfo = importBrands.find(b => b.name.toLowerCase() === typed.toLowerCase());
        let savedCat = null;
        try {
          const probe = /^https?:\/\//i.test(typed) ? typed : ('https://' + typed.replace(/\s+/g, '').toLowerCase());
          savedCat = await findSavedCatalog(probe, typed);
          const FRESH_MS = 36 * 3600 * 1000;
          const fresh = savedCat && savedCat.updated && (Date.now() - savedCat.updated) < FRESH_MS;
          // 서버가 못 긁는 브랜드(확장·헤드리스 담당)는 실시간 수집이 어차피 실패한다.
          // 저장본이 오래됐어도 그대로 보여준다 — 안 그러면 실패할 게 뻔한 90초를 기다린 뒤
          // 결국 같은 저장본을 보게 된다.
          if (savedCat && (fresh || (bInfo && bInfo.blocked))) {
            await loadCatalog(savedCat.site, savedCat.brand);
            return;
          }
          // 저장본이 오래됐고 차단 표시도 없으면 아래에서 실시간 수집을 시도한다.
          // 그 사이 화면을 비워 두지 않는다 — 저장본을 먼저 깔아 두고, 실시간 결과가
          // 오면 그때 갈아끼운다. 서버가 못 긁는 브랜드가 차단 목록에서 빠져 있으면
          // (ae.com 이 그랬다) 성공할 수 없는 요청을 90초 기다리는 동안 사용자는
          // 빈 화면만 보고 "상품 정보가 안 나온다"고 판단하게 된다.
          if (savedCat) {
            try {
              await loadCatalog(savedCat.site, savedCat.brand);
              importStatusEl.innerHTML =
                `<span style="font-size:12px;color:#888">저장된 ${importItems.length}개를 먼저 보여 드립니다 · 최신 상품 확인 중…</span>`;
            } catch (e2) {}
          }
        } catch (e) {}

        // ②-a 차단 브랜드(서버 수집 불가)인데 저장본도 없으면 → 90초 헛기다림 없이 즉시 안내.
        //      (확장이 수집해 두면 위 ①에서 저장본으로 표시된다)
        if (bInfo && bInfo.blocked && !savedCat) { showNoResult(); return; }

        // ② 저장본이 없으면 Render 서버로 신상 가져오기.
        if (needRender()) return;
        // 입력이 전체 URL이면 그대로, 아니면 브랜드 "이름"으로 보고 목록에서 URL을 찾음.
        let brandUrl = typed;
        if (!/^https?:\/\//i.test(typed)) {
          if (!importBrands.length) await loadBrandList();
          const low = typed.toLowerCase();
          const hit = importBrands.find(b => b.name.toLowerCase() === low)
            || importBrands.find(b => b.name.toLowerCase().startsWith(low))
            || importBrands.find(b => b.name.toLowerCase().includes(low));
          if (!hit) {
            importStatusEl.textContent =
              `"${typed}"에 맞는 브랜드를 목록에서 못 찾았습니다. 목록에서 고르거나 전체 URL(https://…)을 붙여넣으세요.`;
            return;
          }
          brandUrl = hit.url;
        }

        importFetchBtn.disabled = true;
        importGridEl.style.display = 'none';
        importTabsEl.style.display = 'none';
        importToolbarEl.style.display = 'none';
        importAddBtn.style.display = 'none';
        importItems = [];
        importStatusEl.innerHTML =
          `<div style="text-align:center;line-height:1.7">가져오는 중…</div>`;

        try {
          // 각 카테고리마다 최대 100개(tops·pants·dresses … 각각 100).
          const q = '/api/products?new=100&tops=100&sweatshirts=100&shirts=100&dresses=100&pants=100&url=' +
            encodeURIComponent(brandUrl);
          // 서버 무응답(잠듦/다운) 시 90초에서 포기 — 영원히 "가져오는 중"으로 멈추지 않도록.
          const ctl = new AbortController();
          const timer = setTimeout(() => ctl.abort(), 90000);
          let resp;
          try { resp = await fetch(__render + q, { signal: ctl.signal }); }
          finally { clearTimeout(timer); }
          if (!resp.ok) throw new Error('server ' + resp.status);
          const data = await resp.json();
          importBrand = data.brand || '';
          importItems = (data.products || []).map(p => ({
            id: p.id, name: p.name || '', category: p.category || 'tops',
            imageUrl: p.imageUrl || '', productUrl: p.productUrl || '',
            price: p.price || '', priceOrig: p.priceOrig || '', comp: p.comp || '',
            color: p.color || '', sizes: p.sizes || '', brand: p.brand || importBrand,
            selected: false,   // 시작은 전부 미선택 — 사용자가 직접 고른다
          })).filter(p => p.imageUrl && p.productUrl);

          if (!importItems.length) {
            // 실시간 수집이 비었으면: 오래된 저장본이라도 있으면 그걸 표시(빈 화면보다 낫다).
            const saved = savedCat || await findSavedCatalog(brandUrl, typed);
            if (saved) {
              await loadCatalog(saved.site, saved.brand);
              return;
            }
            // 원인(봇차단·수집실패)을 구분해 봐야 사용자가 할 일은 같다 → 한 가지 안내로 통일.
            showNoResult();
            return;
          }
          loadedBrandMode = true;
          // 중복 방지: 카테고리별 개수는 탭에만 표시. 상태줄은 부분수집일 때만 안내.
          importStatusEl.textContent = '';   // (부분 카탈로그 안내 제거 — 불필요)
          // 카테고리 필터가 선택돼 있으면 그 탭, 아니면 ALL(전 카테고리).
          importCat = (wantCat && catCount(wantCat)) ? wantCat : '';
          renderImportTabs();
          renderImportGrid();
        } catch (e) {
          // 서버 무응답/오류 → 오래된 저장본이라도 있으면 그걸로 폴백.
          if (savedCat) {
            try { await loadCatalog(savedCat.site, savedCat.brand); return; } catch (e2) {}
          }
          const aborted = e && (e.name === 'AbortError' || /aborted/i.test(e.message || ''));
          importStatusEl.innerHTML = aborted
            ? `<div style="padding:8px;background:#fff4f4;border-radius:6px;font-size:12px">` +
              `<b>⏱ Market Research 서버가 응답하지 않습니다(90초 초과).</b><br>` +
              `Render 무료 서버가 <b>잠들어 있거나 내려간</b> 상태일 수 있어요. ` +
              `<b>${escapeHtml(__render || '(주소 미설정)')}/api/brands</b> 를 브라우저에서 열어보세요 — ` +
              `JSON이 뜨면 살아있는 것(다시 시도), 안 뜨면 서버 재가동이 필요합니다.</div>`
            : '가져오기 실패: ' + escapeHtml((e && e.message) || String(e)) +
              ' — ⚙ 설정의 Render 주소가 맞는지 확인하세요.';
        } finally {
          importFetchBtn.disabled = false;
        }
      }

      const titleMatch = (p) => !titleQuery || (p.name || '').toLowerCase().includes(titleQuery);
      function catCount(key) { return importItems.filter(p => p.category === key && titleMatch(p)).length; }
      function visibleItems() {
        return importItems.filter(p => (!importCat || p.category === importCat) && titleMatch(p));
      }

      // 카테고리 UI는 드롭다운 하나로 일원화. (호출부 호환을 위해 이름 유지)
      function renderImportTabs() {
        fillCatPicker();
      }

      function renderImportGrid() {

        // 카드: 썸네일 → 이름 → 가격 (원단은 목록에 없어 표시하지 않음)
        visibleItems().forEach(it => {

            ` data-comp="${escapeHtml(cleanVal(it.comp))}">` +

          card.addEventListener('click', () => {
