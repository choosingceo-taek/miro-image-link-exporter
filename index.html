      // ── 보드로 드래그: 커서에 상품 썸네일이 따라가도록(어디에 놓일지 보이게) ──
      // 이미지가 카드 전체를 덮으므로(full-bleed) 드래그 = 보드 추가. 다중 선택은 클릭·ALL 사용.
      let justDragged = false;
      importGridEl.addEventListener('dragstart', (e) => {
        const img = e.target.closest('img.miro-draggable');
        if (!img) { e.preventDefault(); return; }
        justDragged = true;
        try {
          e.dataTransfer.effectAllowed = 'copy';
          e.dataTransfer.setData('text/uri-list', img.dataset.link || img.src);
          e.dataTransfer.setData('text/plain', img.dataset.link || img.src);
          // 커서 중앙에 썸네일이 붙어 따라다니도록.
          const r = img.getBoundingClientRect();
          e.dataTransfer.setDragImage(img, r.width / 2, r.height / 2);
        } catch (_) {}
      });
      importGridEl.addEventListener('dragend', () => { setTimeout(() => { justDragged = false; }, 0); });

      function updateImportToolbar() {
        const total = importItems.filter(it => it.selected).length;
        importCountEl.textContent = `Selected ${total}`;
        if (importExportBtn) importExportBtn.disabled = !total;
      }

      // ALL = 이 탭 전체 선택 · RESET = 모든 탭 선택 초기화 · EXPORT = 선택 상품 보드에 추가
      const importExportBtn = document.getElementById('importExport');
      importSelAllBtn.addEventListener('click', () => { visibleItems().forEach(it => it.selected = true); renderImportGrid(); });
      importSelNoneBtn.addEventListener('click', () => { importItems.forEach(it => it.selected = false); renderImportGrid(); });
      if (importExportBtn) importExportBtn.addEventListener('click', () => importAddBtn.click());

      // 브라우저가 남의 도메인 이미지를 miro.createImage에 못 넣을 때(CORS),
      // Render의 /api/image 프록시로 받아 data URL로 변환해 넣는다.
      // 브라우저에서 직접 이미지를 로드(crossOrigin)해 캔버스로 data URL 변환.
      // CDN이 CORS(Access-Control-Allow-Origin)를 주면 Worker 없이 바로 됨 — Aritzia 등 대부분 허용.
      function imgElToDataUrl(url, maxW) {
        return new Promise((resolve, reject) => {
          const im = new Image();
          im.crossOrigin = 'anonymous';
          im.referrerPolicy = 'no-referrer';
          im.onload = () => {
            try {
              const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
              if (!iw || !ih) return reject(new Error('empty'));
              const scale = Math.min(1, maxW / iw);
              const w = Math.max(1, Math.round(iw * scale)), h = Math.max(1, Math.round(ih * scale));
              const c = document.createElement('canvas'); c.width = w; c.height = h;
              c.getContext('2d').drawImage(im, 0, 0, w, h);
              resolve(c.toDataURL('image/jpeg', 0.87));   // CORS 없으면 여기서 SecurityError
            } catch (e) { reject(e); }
          };
          im.onerror = () => reject(new Error('load-fail'));
          im.src = url;
        });
      }

      async function imgToDataUrl(url, refUrl) {
        // URL 정규화: HTML 엔티티(&amp;) 복원·프로토콜상대(//) 보정.
        let u0 = String(url || '').replace(/&amp;/gi, '&').trim();
        if (u0.startsWith('//')) u0 = 'https:' + u0;
        const errs = [];
        // ① 브라우저 직접(crossOrigin+캔버스) — CDN이 CORS 주면 Worker 불필요.
        try { return await imgElToDataUrl(u0, 1200); } catch (e) { errs.push('direct:' + ((e && e.message) || e)); }
        // 이미지 CDN Referer 검사 대응: 상품 사이트 origin을 ref로.
        let ref = '';
        try { if (refUrl) ref = '&ref=' + encodeURIComponent(new URL(refUrl).origin); } catch (e) {}
        // ② Worker ?img=(referer 전략) ③ Render /api/image
        const attempts = [];
        if (__proxy.url) attempts.push(['worker', __proxy.url.replace(/\/+$/, '') + '/?img=' +
          encodeURIComponent(u0) + ref + (__proxy.token ? '&token=' + encodeURIComponent(__proxy.token) : '')]);
        if (__render) attempts.push(['render', __render + '/api/image?url=' + encodeURIComponent(u0)]);
        for (const [name, u] of attempts) {
          try {
            const resp = await fetch(u);
            if (!resp.ok) { errs.push(name + ':' + resp.status); continue; }
            const blob = await resp.blob();
            if (!/^image\//.test(blob.type || '')) { errs.push(name + ':not-image(' + (blob.type || '?') + ')'); continue; }
            return await blobToJpegDataUrl(blob, 1200);
          } catch (e) { errs.push(name + ':' + ((e && e.message) || e)); }
        }
        throw new Error('이미지 변환 실패 [' + (errs.join(', ') || 'no method') + ']');
      }

      // 원본이 크거나(수천px) webp/avif면 data URL이 미로 업로드 한도를 넘어 실패할 수 있음 →
      // 캔버스로 최대 1200px JPEG로 축소·변환해 안정적으로 업로드.
      async function blobToJpegDataUrl(blob, maxW) {
        try {
          const bmp = await createImageBitmap(blob);
          const scale = Math.min(1, maxW / bmp.width);
          const w = Math.max(1, Math.round(bmp.width * scale));
          const h = Math.max(1, Math.round(bmp.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
          return canvas.toDataURL('image/jpeg', 0.87);
        } catch (e) {
          // 디코딩 실패(브라우저 미지원 포맷 등) 시 원본 그대로 data URL
          return await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(r.result); r.onerror = () => rej(new Error('read fail'));
            r.readAsDataURL(blob);
          });
        }
      }

      async function createBoardImage(it, props) {
        // 미로에 URL을 넘기면 "미로 서버"가 그 CDN을 fetch하는데, Aritzia 등은 미로 서버 요청을
        // 차단해 위젯만 생기고 이미지가 깨짐(경고 토스트). → 브라우저에서 프록시로 바이트를 받아
        // data URL로 "인라인" 삽입하는 걸 1순위로. 프록시가 실패할 때만 원본 URL로 시도.
        let proxyErr = null;
        try {
          const dataUrl = await imgToDataUrl(it.imageUrl, it.productUrl);   // 상품 사이트를 referer로
          return await miro.board.createImage({ ...props, url: dataUrl });
        } catch (e) { proxyErr = e; }
        try {
          return await miro.board.createImage({ ...props, url: it.imageUrl });
        } catch (e2) {
          throw proxyErr || e2;   // 둘 다 실패면 프록시 원인을 보고(진단용)
        }
      }

      importAddBtn.addEventListener('click', async () => {
        const targets = importItems.filter(it => it.selected);
        if (!targets.length) { importStatusEl.textContent = '선택한 상품이 없습니다.'; return; }
        importAddBtn.disabled = true;
        try {
          // 보드 화면 폭의 ~10% 크기로, 현재 화면 좌상단부터 배치.
          let startX = 0, startY = 0, cellW = 240;
          try {
            const vp = await miro.board.viewport.get();
            cellW = Math.min(Math.max(Math.round(vp.width * 0.10), 120), 2400);
            startX = vp.x + cellW * 0.3; startY = vp.y + cellW * 0.3;
          } catch (e) {}
          const gap = cellW * 0.14, cols = 5;
          const created = [];
          let fail = 0, firstErr = '';
          for (let i = 0; i < targets.length; i++) {
            const it = targets[i];
            importStatusEl.textContent = `보드에 추가하는 중… (${i + 1}/${targets.length})`;
            try {
              const col = i % cols, row = Math.floor(i / cols);
              const img = await createBoardImage(it, {
                title: boardTitle(it),
                x: startX + col * (cellW + gap) + cellW / 2,
                y: startY + row * (cellW * 1.5 + gap) + cellW / 2,
                width: cellW,
              });
              img.linkedTo = httpsUrl(it.productUrl);
              await img.sync();
              cacheImg(img.id, it);   // 엑셀용으로 이미지URL·이름·가격·브랜드 기억
              created.push(img);
            } catch (e) {
              fail++;
              const reason = (e && e.message) || String(e);
              if (!firstErr) firstErr = reason;
              try { console.error('[RACK 보드추가 실패]', it.productUrl, '\n  이미지:', it.imageUrl, '\n  원인:', reason); } catch (_) {}
            }
          }
          try { if (created.length && miro.board.viewport.zoomTo) await miro.board.viewport.zoomTo(created); } catch (e) {}
          // 성공 안내는 표시하지 않음(요청). 실패가 있을 때만 원인을 남긴다.
          if (fail) {
            let msg = `${created.length}개 추가, ${fail}개 실패.`;
            if (firstErr) {
              msg += /permission|scope|write|forbidden|401|403/i.test(firstErr)
                ? ` ⚠ 권한 문제 — 앱에 boards:write 추가·재설치 필요. (원인: ${firstErr})`
                : ` (원인: ${firstErr})`;
            }
            importStatusEl.textContent = msg;
          } else {
            importStatusEl.textContent = '';
          }
          // 실패가 있으면 놓치지 않게 팝업으로도 원인을 보여줌(토스트에 가려지는 문제 대응).
          if (fail) {
            try { alert(`보드 추가 결과\n\n추가 ${created.length}개 · 실패 ${fail}개\n\n첫 실패 원인:\n${firstErr}\n\n(자세한 건 F12 → Console)`); } catch (_) {}
          }
        } finally {
          importAddBtn.disabled = false;
        }
      });

      // 상품 URL 끝부분을 대략적 제목으로. 예: /w-tshirts-basic → "w tshirts basic"
      function titleFromUrl(u) {
        try {
          const segs = new URL(u).pathname.split('/').filter(Boolean)
            .map(s => { try { return decodeURIComponent(s); } catch (e) { return s; } })
            .map(s => s.replace(/\.(html?|php|aspx?)$/i, ''));
          // 마지막 조각이 항상 이름은 아님(lululemon: …/{이름}/prod123, aritzia: …/{이름}/121186.html).
          // 뒤에서부터 "이름다운" 조각을 고름: 순수 ID·로케일·일반 경로어는 건너뜀.
          const generic = /^(p|products?|item|items|shop|goods|detail|dp|prd|prod|sku|style|collections?|category|c|us|en|kr|ko|www)$/i;
          const idLike = /^(prod|item|sku|p|s|style)?[-_]?\d[\d._-]*[a-z]{0,3}$/i;   // prod9820343 · 121186 · s20990 등
          const locale = /^[a-z]{2}([-_][a-z]{2})?$/i;
          let seg = '';
          for (let i = segs.length - 1; i >= 0; i--) {
            const s = segs[i];
            if (!s || generic.test(s) || locale.test(s) || idLike.test(s)) continue;
            const letters = (s.match(/[a-zÀ-ɏ가-힯]/gi) || []).length;
            if (letters < 3) continue;   // 글자가 거의 없으면 이름이 아님
            seg = s;
            break;
          }
          if (!seg) return '';   // 이름다운 조각이 없으면(전부 ID뿐) 빈 값 — "00" 같은 ID 노출 방지
          // 조각 앞뒤의 SKU 토큰 제거: "s20990-white-and-black" → "white and black", "자켓-p12345" → "자켓"
          return seg.replace(/^[a-z]{0,4}\d{3,}[a-z0-9]*[-_]+/i, '')
            .replace(/[-_]+[a-z]{0,4}\d{3,}[a-z0-9]*$/i, '')
            .replace(/\.\d{4,}[\d.]*$/, '')
            .replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim();
        } catch (e) { return ''; }
      }

      // 상품 URL·이름으로 카테고리 추정 (탭 분류용)
      // 카테고리 추정: 이름(상품명) 우선 + 단어경계 매칭 → URL의 잡음 단어(코디/추천 경로의 'pant' 등)로
      // 셔츠가 팬츠로 오분류되던 문제 해결. 이름에 단서가 없을 때만 URL을 보조로 사용.
      function guessCat(u, name) {
        const n = ' ' + String(name || '').toLowerCase() + ' ';
        const url = ' ' + String(u || '').toLowerCase() + ' ';
        const nHas = (re) => re.test(n);
        // ① 이름 우선. 순서가 중요하다:
        //   하의 먼저(trackpant·sweatpant가 sweat/top으로 새는 것 방지)
        //   → 스웨트(sweatshirt가 shirts로 새는 것 방지) → 티/탑(t-shirt가 shirts로 새는 것 방지) → 셔츠
        if (nHas(/dress|gown|jumpsuit|romper|원피스|점프수트/) && !nHas(/(?<!t[-\s])shirt[-\s]?dress/)) return 'dresses';
        if (nHas(/pants?\b|trouser|chino|legging|jogger|slack|culotte|capri|skorts?\b|skirts?\b|\bshorts\b|바지|팬츠|슬랙스|청바지|쇼츠|반바지|레깅스|조거|스커트|치마/) || nHas(/\b(?:jeans?|denim)\b(?!\s?(?:jacket|shirt|blouse|dress|skirt|vest|coat|top))/)) return 'pants';
        if (nHas(/sweat|hoodie|hoody|jumper|cardigan|knit(?!\s?(?:tank|tee|cami|top))|sweater|맨투맨|후드|니트|가디건|스웨터/)) return 'sweatshirts';
        if (nHas(/t[-\s]?shirt|tees?\b|tank|cami|camisole|halter|bodysuit|crop\s*top|티셔츠|나시|캐미|홀터/)) return 'tops';
        if (nHas(/shirt|blouse|button[-\s]?down|oxford|셔츠|블라우스|남방/)) return 'shirts';
        if (nHas(/\btop\b|탑/)) return 'tops';
        // ② 이름에 단서가 없으면 URL 보조
        // 이름이 겉옷을 가리키면 URL 보조는 건너뛴다. 상품명이 'Denim Jacket'인데 주소에 denim이
        // 들어 있다는 이유로 pants가 되던 문제 — 겉옷 칸이 없으니 기본값 tops로 두는 편이 덜 틀리다.
        const outer = nHas(/jacket|coat|blazer|parka|anorak|\bvest\b|재킷|자켓|코트|점퍼|베스트|조끼/);
        if (!outer && /dress|원피스/.test(url)) return 'dresses';
        if (!outer && /pants?\b|trouser|jeans?\b|denim|chino|legging|jogger|shorts?\b|skirts?\b|skorts?\b|바지|팬츠/.test(url)) return 'pants';
        if (/sweat|hoodie|knit|cardigan|맨투맨|후드|니트/.test(url)) return 'sweatshirts';
        if (/shirt|blouse|셔츠|블라우스/.test(url)) return 'shirts';
        return 'tops';
      }

      // (차단 사이트 수동 추가(콘솔 복붙)·팀 저장소 저장 기능은 제거됨 —
      //  Chrome 확장(chrome-extension/)·유저스크립트(rack-harvester.user.js)가 자동으로 대체.)

      // ── 공유 카탈로그(하드차단 사이트, 확장·유저스크립트가 올려둔 것) ─────────
      const cacheRowEl = document.getElementById('cacheRow');
      // 저장된 카탈로그는 "칩"으로 따로 보이지 않게 함 — 브랜드명을 검색하면 리스트로 뜬다.
      async function loadCatalogChips() {
        if (cacheRowEl) cacheRowEl.style.display = 'none';
        return;
        /* eslint-disable no-unreachable */
        if (!__proxy.url) return;
        try {
          const base = __proxy.url.replace(/\/+$/, '');
          const tok = __proxy.token ? '&token=' + encodeURIComponent(__proxy.token) : '';
          const resp = await fetch(base + '/?catalogs=1' + tok);
          const data = await resp.json();
          const list = (data && data.list) || [];
          cacheRowEl.innerHTML = '';
          if (!list.length) { cacheRowEl.style.display = 'none'; return; }
          const lbl = document.createElement('span');
          lbl.style.cssText = 'font-size:11px;color:#888;align-self:center';
          lbl.textContent = '저장된 카탈로그:';
          cacheRowEl.appendChild(lbl);
          list.sort((a, b) => (b.updated || 0) - (a.updated || 0)).forEach(c => {
            const b = document.createElement('button');
            const days = c.updated ? Math.floor((Date.now() - c.updated) / 86400000) : 999;
            const stale = days >= 14;   // 2주 넘으면 갱신 권장 표시
            b.style.cssText = 'width:auto;padding:4px 9px;font-size:11px;font-weight:600;border-radius:14px;' +
              (stale ? 'background:#fff4e5;color:#a15c00;border:1px solid #f0c98a' : 'background:#eef0f5;color:#333');
            const when = days === 0 ? '오늘' : days >= 999 ? '' : days + '일 전';
            b.textContent = `${c.brand || c.site} (${c.count})` + (stale ? ' ⚠' : '');
            b.title = `${c.site} · ${when} 갱신` + (stale ? ' — 오래됨, 갱신 권장' : '');
            b.addEventListener('click', () => loadCatalog(c.site, c.brand));
            cacheRowEl.appendChild(b);
          });
          cacheRowEl.style.display = 'flex';
        } catch (e) { cacheRowEl.style.display = 'none'; }
      }

      // 결과가 하나도 없을 때만 쓰는 안내. (로딩 중에는 아무 문구도 띄우지 않는다)
      function showNoResult() {
        importItems = [];
        importGridEl.style.display = 'none';
        importTabsEl.style.display = 'none';
        importToolbarEl.style.display = 'none';
        importAddBtn.style.display = 'none';
        importStatusEl.innerHTML =
          '<div style="padding:12px;background:#f6f6f6;border-radius:6px;color:#111;font-size:13px;line-height:1.7;text-align:center">' +
          '해당 정보는 검색 결과 확인이 필요합니다.<br>디지털팀에 확인 요청 부탁드립니다. 감사합니다.</div>';
      }

      async function loadCatalog(site, brand) {
        // 저장본은 즉시 뜨므로 "불러오는 중" 안내를 띄우지 않는다 — 문구가 깜빡였다 사라질 뿐이다.
        importStatusEl.textContent = '';
        try {
          const base = __proxy.url.replace(/\/+$/, '');
          const tok = __proxy.token ? '&token=' + encodeURIComponent(__proxy.token) : '';
          // 카탈로그 본문과 오버레이를 함께 받는다. 혼용률·컬러웨이·사이즈는 야간 보강이
          // 오버레이(comp:<site>)에 쌓는다 — 카탈로그 item 에는 안 들어간다. 예전엔 여기서
          // 카탈로그만 읽어서, 오버레이가 100% 차 있어도 브랜드 목록에서 뽑은 엑셀의
          // 혼용률·컬러웨이 칸이 통째로 비었다(보드 스캐너 쪽만 오버레이를 읽고 있었다).
          const [resp, om] = await Promise.all([
            fetch(base + '/?catalog=' + encodeURIComponent(site) + tok),
            fetch(base + '/?comps=' + encodeURIComponent(site) + tok)
              .then((r) => r.json()).catch(() => ({})),
          ]);
          if (!resp.ok) { showNoResult(); return; }
          const data = await resp.json();
          // 상품URL 표기가 조금씩 달라도 맞도록 보드 스캐너와 같은 urlKey 로 맞춘다.
          const ov = new Map();
          for (const [u, o] of Object.entries(om || {})) if (o) ov.set(urlKey(u), o);
          importItems = (data.items || []).map((p, i) => {
            const cat = guessCat(p.productUrl, p.name);   // 저장된 category 대신 재분류(오분류 교정)
            const o = ov.get(urlKey(p.productUrl)) || {};
            return {
              id: 'c' + i, name: p.name || '', category: cat,
              imageUrl: p.imageUrl, productUrl: p.productUrl,
              price: p.price || o.price || '',
              priceOrig: p.priceOrig || o.priceOrig || '',
              comp: p.comp || o.comp || '',
              // 사이트가 소재를 아예 안 적는 상품 — 엑셀에서 '확인 필요'와 구분한다.
              compNone: !!(o.none && !(p.comp || o.comp)),
              color: p.color || o.color || '',
              sizes: p.sizes || o.sizes || '',
              brand: data.brand || brand || '', selected: false,
            };
          }).filter(p => p.imageUrl && p.productUrl);
          // 서버 검색과 동일하게 카테고리당 최대 100개만 표시(저장본은 수백 개일 수 있음).
          const stored = importItems.length;
          const perCat = {};
          importItems = importItems.filter(p => {
            perCat[p.category] = (perCat[p.category] || 0) + 1;
            return perCat[p.category] <= 100;
          });
          if (!importItems.length) { showNoResult(); return; }
          loadedBrandMode = true;
          importBrand = data.brand || brand || site;
          importStatusEl.textContent = '';   // 수집 시각·개수 등 내부 정보는 노출하지 않음
          importCat = (wantCat && catCount(wantCat)) ? wantCat : '';   // 기본 ALL(전 카테고리)
          renderImportTabs(); renderImportGrid();
        } catch (e) {
          showNoResult();
        }
      }

      // 차단 사이트 검색 시: 팀 저장소에 그 브랜드 수집본이 있는지 찾기(있으면 자동 대체 표시용).
      // 저장본 찾기 — 브랜드가 뒤섞이지 않도록 "정확 일치"만 인정한다.
      // (예전 느슨한 규칙은 site 'on.com'의 접두사 'on'이 'thereformationcom'에
      //  포함된다는 이유로 Reformation 검색에 On 카탈로그를 물려줬다.)
      async function findSavedCatalog(brandUrl, typed) {
        if (!__proxy.url) return null;
        try {
          const base = __proxy.url.replace(/\/+$/, '');
          const tok = __proxy.token ? '&token=' + encodeURIComponent(__proxy.token) : '';
          const resp = await fetch(base + '/?catalogs=1' + tok);
          const data = await resp.json();
          const list = (data && data.list) || [];
          const norm = (s) => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
          let host = '';
          try { host = new URL(brandUrl).hostname.replace(/^www\./, ''); } catch (e) {}
          const nBrand = norm(typed), nHost = norm(host);

          // ① 브랜드 이름 정확 일치 (가장 신뢰).
          //    저장 키는 <host>.<브랜드슬러그> 형식이므로 마지막 조각도 정확 비교한다.
          //    (endsWith로 비교하면 'cottonon'의 끝이 브랜드 'On'과 걸리는 식으로 오염된다.)
          const keySlug = (c) => norm(String(c.site || '').split('.').pop());
          const cands = list.filter(c => nBrand && (norm(c.brand) === nBrand || keySlug(c) === nBrand));
          if (cands.length) {
            // 이름 정확 일치 우선 → 그다음 최신 저장본.
            // (예전 확장이 남긴 호스트-only 키와 새 브랜드별 키가 함께 있을 때 새 쪽을 고른다)
            // 키 슬러그가 브랜드와 맞는 것(<host>.<slug>)을 최우선 —
            // 호스트만으로 저장된 옛 키는 최신이어도 뒤로 보낸다(두 벌이 남아 있을 때가 있다).
            cands.sort((a, b) =>
              ((keySlug(b) === nBrand) - (keySlug(a) === nBrand)) ||
              ((norm(b.brand) === nBrand) - (norm(a.brand) === nBrand)) ||
              ((b.updated || 0) - (a.updated || 0)));
            return cands[0];
          }

          // ② 호스트 정확 일치 — 한 호스트에 브랜드가 하나뿐일 때만 채택(서브브랜드 혼동 방지)
          if (nHost) {
            const sameHost = list.filter(c => {
              const ns = norm(c.site);
              return ns === nHost || ns.startsWith(nHost);
            });
            if (sameHost.length === 1) return sameHost[0];
          }
          return null;
        } catch (e) { return null; }
      }

      fillCatPicker();  // 카테고리 선택 기본값(검색 전)
      loadBrandList(); // 설정에 Render 주소가 이미 있으면 브랜드 목록 미리 로드
      loadCatalogChips(); // 저장된(공유) 카탈로그 칩 표시

      // ── 1) 보드에서 이미지 + 링크 수집 (전체 또는 "선택한 것만") ─────────────
      runBtn.addEventListener('click', () => collectRows(false));
      // 보드에서 선택한 (링크 걸린) 이미지 개수를 버튼이 아니라 검색바 아래 한 줄 상태에 표시.
      try {
        miro.board.ui.on('selection:update', async () => {
          try {
            const sel = await miro.board.getSelection();
            const n = sel.filter(it => it.type === 'image' && (it.linkedTo || '').trim()).length;
            // 작업 중에는 상태줄을 덮지 않음.
            if (basicBtn.classList.contains('working') || basicSelBtn.classList.contains('working')) return;
            statusEl.innerHTML = n ? `보드에서 <b>${n}</b>개 선택됨` : '';
          } catch (e) {}
        });
      } catch (e) {}

      async function collectRows(selectedOnly) {
        runBtn.disabled = true;
        xlsxBtn.style.display = 'none';
        csvBtn.style.display = 'none';
        table.style.display = 'none';
        summaryEl.style.display = 'none';
        tbody.innerHTML = '';
        statusEl.textContent = selectedOnly ? '보드에서 선택한 이미지를 확인하는 중…' : '보드에서 이미지를 불러오는 중…';

        try {
          // 선택한 것만: 보드에서 현재 선택된 이미지. 아니면 보드 전체 이미지.
          let images;
          if (selectedOnly) {
            const sel = await miro.board.getSelection();
            images = sel.filter(it => it.type === 'image');
            if (!images.length) {
              statusEl.textContent = '보드에서 선택된 이미지가 없습니다. 보드에서 이미지를 클릭하거나 마우스 박스로 드래그해 선택한 뒤 다시 눌러주세요.';
              runBtn.disabled = false;
              return;
            }
          } else {
            images = await miro.board.get({ type: 'image' });
          }

          // 미로는 "업로드된 이미지"의 원본 주소를 Web SDK로 노출하지 않습니다.
          // → 실제 이미지는 REST API로만 받을 수 있어, 보드 ID + 아이템 ID를
          //   Worker(서버에 저장된 미로 토큰 사용)에 넘겨 프록시로 가져옵니다.
          if (!__boardId) {
            try { const info = await miro.board.getInfo(); __boardId = (info && info.id) || ''; } catch (e) {}
          }
          try { __imgCache = JSON.parse(localStorage.getItem('rackImgCache:' + __boardId) || '{}'); } catch (e) {}

          rows = images.map((img, i) => {
            // 보드에 이미 http:// 로 걸린 링크도 여기서 https로 올려 내보낸다(Access Denied 방지).
            const link = httpsUrl(img.linkedTo);
            const rec = normalizeRec(__imgCache[img.id]) || {};   // 우리가 넣은 상품이면 정보가 기억돼 있음
            const parsed = parseTitle(img.title || '');           // 아니면 제목에서 최대한 추출
            return {
              index: i + 1,
              id: img.id,
              title: (img.title || '').trim(),
              link,
              // 썸네일: 기억해둔 원본 URL(토큰 불필요) → 없으면 미로 REST 프록시.
              imageUrl: rec.imageUrl || miroThumbUrl(img.id),
              // 상품명: 가져온 상품이면 실제 이름 → 제목에서 → 그래도 없으면 URL 경로에서 추출.
              name: rec.name || parsed.name || (link ? titleFromUrl(link) : ''),
              // URL로만 추정한(또는 빈) 이름은 og:title 보강 대상.
              nameFromUrl: !rec.name && !parsed.name && !!link,
              brand: rec.brand || (link ? brandFromUrl(link) : ''),
              // 카테고리: 저장해 둔 값보다 지금 분류기로 다시 판단하는 쪽이 정확하다
              // (예전 저장분의 오분류를 교정한다). URL·이름만 쓰므로 접속 없음.
              category: link ? guessCat(link, rec.name || parsed.name || '') : (rec.category || ''),
              // 가격: 우리가 넣은 상품이면 기억된 값 → 아니면 제목("… · $128")에서 추출.
              price: rec.price || parsed.price || '',
              priceOrig: rec.priceOrig || '',
              // 캐시가 없어도 캡션에 박아 둔 혼용률로 되살린다(다른 PC에서 스캔할 때).
              comp: rec.comp || parsed.comp || '',
              color: rec.color || '', sizes: rec.sizes || '',
            };
          });

          await fillFromIndex();   // 저장된 상품 인덱스에서 이름·가격·혼용률을 되찾는다(사이트 접속 없음)
          await fillFromCatalogs();   // 인덱스 상한(브랜드당 150개) 밖 상품은 브랜드 카탈로그에서

          const withLink = rows.filter(r => r.link).length;

          // 검색바(스캔 버튼) 아래 한 줄 키워드 상태.
          summaryEl.style.display = 'none';
          summaryEl.innerHTML = '';
          if (rows.length && !__proxy.url) {
            statusEl.innerHTML = `링크 <b>${withLink}</b> · 썸네일은 ⚙ Worker 주소 필요`;
          } else if (rows.length && !__boardId) {
            statusEl.innerHTML = `링크 <b>${withLink}</b> · 보드 ID 없음 (F5 후 재시도)`;
          } else {
            statusEl.innerHTML = `스캔 <b>${rows.length}</b> · 링크 <b>${withLink}</b>`;
          }

          // 미리보기 (최대 50줄) — 썸네일 + 제목/링크 (+원단, 분석 후)
          renderPreview();

          if (rows.length) {
            xlsxBtn.style.display = 'block';
            csvBtn.style.display = 'block';
          } else {
            statusEl.textContent = '이 보드에서 이미지를 찾지 못했습니다.';
          }
        } catch (e) {
          statusEl.textContent = '오류가 발생했습니다: ' + (e && e.message ? e.message : e);
        } finally {
          runBtn.disabled = false;
        }
      }

      // ── 2) 이미지가 들어간 엑셀(.xlsx) 만들기 ────────────────────────
      xlsxBtn.addEventListener('click', async () => {
        if (typeof ExcelJS === 'undefined') {
          statusEl.textContent = '엑셀 라이브러리를 불러오지 못했습니다. 잠시 후 새로고침 뒤 다시 시도하세요.';
          return;
        }
        xlsxBtn.disabled = true;
        csvBtn.disabled = true;

        try {
          const workbook = new ExcelJS.Workbook();
          const ws = workbook.addWorksheet('사진링크');
          ws.columns = [
            { header: '번호', key: 'index', width: 6 },
            { header: '이미지', key: 'img', width: 16 },
            { header: '제목', key: 'title', width: 22 },
            { header: '링크(하이퍼링크)', key: 'link', width: 48 },
            { header: '이미지원본URL', key: 'imageUrl', width: 48 },
            { header: '아이템ID', key: 'id', width: 24 }
          ];
          ws.getRow(1).font = { bold: true };

          let ok = 0, fail = 0;
          for (let i = 0; i < rows.length; i++) {
            const r = rows[i];
            const excelRow = i + 2; // 1행은 헤더
            const row = ws.addRow({
              index: r.index,
              img: '',
              title: r.title,
              link: '',
              imageUrl: r.imageUrl,
              id: r.id ? String(r.id) : ''
            });
            row.height = 60;
            ws.getCell(`F${excelRow}`).numFmt = '@'; // 아이템ID를 텍스트로(지수표기 방지)

            if (r.link) {
              const c = ws.getCell(`D${excelRow}`);
              c.value = { text: r.link, hyperlink: r.link };
              c.font = { color: { argb: 'FF4262FF' }, underline: true };
            }

            if (r.imageUrl) {
              try {
                const { base64, w, h } = await toPng(r.imageUrl, 100);
                const imageId = workbook.addImage({ base64, extension: 'png' });
                ws.addImage(imageId, {
                  tl: { col: 1.05, row: (excelRow - 1) + 0.05 },
                  ext: { width: w, height: h },
                  editAs: 'oneCell'
                });
                row.height = Math.max(row.height, h * 0.75 + 6);
                ok++;
              } catch (e) {
                const c = ws.getCell(`B${excelRow}`);
                c.value = '(이미지 불러오기 실패)';
                c.font = { color: { argb: 'FFBBBBBB' }, size: 9 };
                fail++;
              }
            }
            statusEl.textContent = `엑셀 만드는 중… ${i + 1}/${rows.length}  (이미지 성공 ${ok}, 실패 ${fail})`;
          }

          const buf = await workbook.xlsx.writeBuffer();
          downloadBlob(
            new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
            `miro_image_links_${stamp()}.xlsx`
          );

          statusEl.textContent =
            `완료! 이미지 ${ok}개 삽입` +
            (fail ? `, ${fail}개 실패(미로 이미지 접근 제한).` : '.');
        } catch (e) {
          statusEl.textContent = '엑셀 생성 중 오류: ' + (e && e.message ? e.message : e);
        } finally {
          xlsxBtn.disabled = false;
          csvBtn.disabled = false;
        }
      });

      // ── 3) (선택) 텍스트만 CSV ──────────────────────────────────────
      csvBtn.addEventListener('click', () => {
        const header = ['번호', '제목', '링크(하이퍼링크)', '이미지원본URL', '아이템ID'];
        const lines = [header].concat(
          rows.map(r => [r.index, r.title, r.link, r.imageUrl, r.id])
        );
        const csv = lines.map(cols =>
          cols.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')
        ).join('\r\n');
        // BOM('﻿')을 붙여야 엑셀에서 한글이 깨지지 않습니다.
        downloadBlob(
          new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' }),
          `miro_image_links_${stamp()}.csv`
        );
      });

      // 엑셀 한 행의 값. 사이트에서 못 가져온 칸은 비우지 않고 '확인 필요'로 채운다 —
      // 빈칸은 "값이 없는 상품"인지 "수집 실패"인지 구분이 안 돼서 사람이 판단을 못 한다.
      const NEED = '확인 필요';
      // 사이트가 그 정보를 아예 싣지 않는 경우. '확인 필요'와 달리 사람이 더
      // 확인해도 나올 것이 없다는 뜻이라, 서식도 회색으로 따로 준다.
      const NO_INFO = '정보 없음';
      // 예전 저장 사고로 '[object Object]' 가 값으로 남은 상품이 있다 — 빈 값으로 본다.
      const cleanVal = (v) => { const t = String(v || '').trim(); return t.includes('[object Object]') ? '' : t; };

      // ── 값이 옳은지 판정 — worker/fabric-extractor.js 와 같은 규칙 ──
      // '있다'가 아니라 '옳다'로 센다. 절반만 뽑힌 혼용률("Cotton 60%")이나
      // 안내 문구가 들어간 컬러("Select")는 엑셀에 실리면 오히려 헷갈린다.
      // 규칙이 어긋나면 scripts/test-valid.mjs 가 CI 에서 실패시킨다.
      const COMP_ITEM_RX = /^[A-Za-z][A-Za-z ]{1,24} (\d{1,3})%$/;
      function validComp(s) {
        const t = String(s || '').trim();
        if (!t || t.includes('[object Object]')) return false;
        // 원단이 두 가지면 줄이 나뉜다. 줄마다 따로 본다.
        const lines = t.split('\n').map((x) => x.trim()).filter(Boolean);
        if (!lines.length || lines.length > 2) return false;
        for (const line of lines) {
          const parts = line.split(' / ');
          if (parts.length > 8) return false;
          let total = 0;
          for (const p of parts) {
            const m = p.match(COMP_ITEM_RX);
            if (!m) return false;
            const n = Number(m[1]);
            if (!(n > 0 && n <= 100)) return false;
            total += n;
          }
          const ok = (total >= 95 && total <= 105) || (lines.length === 1 && total >= 190 && total <= 210);
          if (!ok) return false;
        }
        return true;
      }
      const COLOR_BAD_RX = /^(?:select|choose|colou?r|색상|컬러|선택|기타|없음|n\/a|none|null|undefined|\d+|#[0-9a-f]{3,8})$/i;
      function validColor(s) {
        const t = String(s || '').trim();
        if (!t || t.length > 40 || t.includes('[object Object]')) return false;
        return !COLOR_BAD_RX.test(t);
      }

      // ── 컬러웨이·혼용률 열 스위치 ──────────────────────────────────
      // 절반만 차 있으면 '확인 필요'가 뒤섞인 표가 나가는데, 그건 쓸 수 없다.
      // 그래서 95% 기준을 둔다 — 다만 그 기준을 '전체 평균'에 걸면, 이미 100%
      // 채워진 브랜드(American Eagle 132/132)를 뽑을 때도 다른 브랜드가 비었다는
      // 이유로 계속 빈 칸으로 나간다. 기준은 같게 두고 적용 대상만 바꾼다:
      // 지금 이 엑셀에 실리는 상품들이 95% 를 넘기면 그 파일에는 열을 붙인다.
      // 두 열을 따로 판단한다. 예전에는 하나로 묶어서, 혼용률이 98% 인 브랜드도
      // 컬러웨이가 60% 라는 이유로 혼용률 열까지 닫혔다 — 우선순위가 다른 두 값을
      // 한 스위치에 묶은 탓이다. 혼용률이 1순위이므로 각자 기준을 넘으면 각자 열린다.
      //
      // 'auto' = 그 파일에 실리는 상품이 기준을 넘으면 붙인다.
      // true/false = 사람이 강제한다. 컬러웨이는 아직 닫아 둔다.
      const SHOW_COMP_COLUMN = 'auto';
      const SHOW_COLOR_COLUMN = false;
      const FABRIC_GATE = 0.95;
      const ratio = (items, ok) => (items && items.length ? items.filter(ok).length / items.length : 0);
      function compReady(items) {
        if (SHOW_COMP_COLUMN !== 'auto') return !!SHOW_COMP_COLUMN;
        return ratio(items, (r) => validComp(cleanVal(r.comp))) >= FABRIC_GATE;
      }
      function colorReady(items) {
        if (SHOW_COLOR_COLUMN !== 'auto') return !!SHOW_COLOR_COLUMN;
        return ratio(items, (r) => validColor(cleanVal(r.color))) >= FABRIC_GATE;
      }
      const BASE_COLS = [
        { header: '브랜드', key: 'brand', width: 18 },
        { header: '썸네일', key: 'img', width: 18 },
        { header: 'URL', key: 'link', width: 52 },
        { header: '상품명', key: 'name', width: 42 },
      ];
      const COLOR_COL = { header: '컬러웨이', key: 'color', width: 20 };
      // 원단이 두 가지면 두 줄로 들어간다 — 넉넉히 잡는다(wrapText 는 아래에서 켠다).
      const COMP_COL = { header: '혼용률', key: 'comp', width: 34 };
      // 열 문자(A,B,C…)는 열 개수에서 만든다 — 손으로 적으면 스위치를 켤 때 어긋난다.
      const colLetter = (n) => String.fromCharCode(65 + n);
      const colsFor = (showColor, showComp) =>
        BASE_COLS.concat(showColor ? [COLOR_COL] : [], showComp ? [COMP_COL] : []);
      const rowColFor = (cols) => {
        const m = {};
        cols.forEach((c, n) => { if (c.key !== 'img' && c.key !== 'link') m[c.key] = colLetter(n); });
        return m;
      };

      function rowValues(r, brandGuess, rowCol, showColor, showComp) {
        const vals = {
          brand: r.brand || brandGuess || '',
          name: r.name || '',
        };
        // 야간 수집분(오버레이)에서 채워진 값만 쓴다 — 여기서 상품 페이지를
        // 읽으면 수십 개 상품에 수십 번 접속하게 된다.
        if (showColor) vals.color = cleanVal(r.color);
        if (showComp) vals.comp = cleanVal(r.comp);
        for (const k of Object.keys(rowCol)) {
          if (String(vals[k] || '').trim()) continue;
          // '확인 필요'는 "아직 못 구했다 — 사람이 확인해 달라"는 뜻이다. 사이트가
          // 소재를 아예 안 적는 상품까지 그렇게 적으면, 아무리 확인해도 나오지 않는
          // 칸을 계속 들여다보게 된다. 그건 '정보 없음'으로 적어 구분한다.
          vals[k] = (k === 'comp' && r.compNone) ? NO_INFO : NEED;
        }
        return vals;
      }

      // 보드와 저장된 상품 인덱스에 이미 있는 값만 쓴다 — 쇼핑몰 접속 0회, 몇 초면 끝난다.
      async function buildBasicXlsx() {
        if (typeof ExcelJS === 'undefined') {
          statusEl.textContent = '엑셀 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도하세요.';
          return;
        }
        const items = rows.filter(r => r.link).slice()
          .sort((a, b) => brandFromUrl(a.link).localeCompare(brandFromUrl(b.link)) || a.link.localeCompare(b.link));
        if (!items.length) { statusEl.textContent = '링크가 걸린 이미지가 없습니다.'; return; }

        const workbook = new ExcelJS.Workbook();
        const ws = workbook.addWorksheet('상품정보');
        // 열 구성은 SHOW_FABRIC_COLUMNS 스위치가 정한다(위쪽 선언부 참고).
        // 이 파일에 실리는 상품들만 보고 열을 정한다(위 설명 참고). 두 열을 따로 본다.
        const showColor = colorReady(items), showComp = compReady(items);
        const XLSX_COLS = colsFor(showColor, showComp);
        const ROW_COL = rowColFor(XLSX_COLS);
        ws.columns = XLSX_COLS;
        ws.getRow(1).font = { bold: true };
        const urlCol = 'C';
        const lastCol = colLetter(XLSX_COLS.length - 1);
        const needCells = [];   // '확인 필요' 칸 위치 — 마지막에 한 번에 서식 적용
        const noInfoCells = [];  // '정보 없음' 칸 — 사이트가 아예 안 싣는 값

        let okThumb = 0, thumbFailDiag = '';
        for (let i = 0; i < items.length; i++) {
          const r = items[i], excelRow = i + 2;
          // 정가 = 할인 전 가격. 할인이 아니면 정가 칸에 그대로 두고 할인가는 비운다
          // (엑셀에서 정가 열만 봐도 모든 상품의 가격이 한 줄로 읽힌다).
          const vals = rowValues(r, brandFromUrl(r.link), ROW_COL, showColor, showComp);
          for (const k of Object.keys(vals)) {
            if (vals[k] === NEED) needCells.push(ROW_COL[k] + excelRow);
            // '정보 없음'은 사람이 손볼 것이 아니므로 '확인 필요' 개수에 넣지 않는다.
            else if (vals[k] === NO_INFO) noInfoCells.push(ROW_COL[k] + excelRow);
          }
          const row = ws.addRow({ ...vals, img: '', link: '' });
          row.height = 60;
          // 상품명·혼용률은 길어질 수 있어 줄바꿈해 둔다.
          for (const k of Object.keys(ROW_COL)) {
            if (k === 'brand') continue;
            ws.getCell(`${ROW_COL[k]}${excelRow}`).alignment = { wrapText: true, vertical: 'middle' };
          }
          const c = ws.getCell(`${urlCol}${excelRow}`);   // URL 열
          c.value = { text: r.link, hyperlink: r.link };
          c.font = { color: { argb: 'FF4262FF' }, underline: true };
          // 썸네일 후보를 순서대로 시도: ① 보드 이미지(캐시 URL 또는 REST 프록시)
          //  → ② (보드 이미지 실패 시) 링크된 페이지 대표이미지 og:image (토큰 불필요 폴백)
          const putThumb = async (src) => {
            const { base64, w, h } = await toPng(src, 110);
            const id = workbook.addImage({ base64, extension: 'png' });
            ws.addImage(id, { tl: { col: 1.1, row: (excelRow - 1) + 0.1 }, ext: { width: w, height: h }, editAs: 'oneCell' });
            row.height = Math.max(row.height, h * 0.75 + 6);
          };
          // 썸네일 = 미로 보드에 올라간 이미지 그 자체만 사용 (사이트 URL 미접근).
          let done = false;
          if (r.imageUrl) {
            try { await putThumb(r.imageUrl); done = true; okThumb++; } catch (e) {}
          }
          if (!done) {
            ws.getCell(`B${excelRow}`).value = NEED;
            needCells.push('B' + excelRow);
            if (!thumbFailDiag && r.imageUrl) {
              const probe = __proxy.url
                ? __proxy.url.replace(/\/+$/, '') + '?img=' + encodeURIComponent(r.imageUrl) +
                  (__proxy.token ? '&token=' + encodeURIComponent(__proxy.token) : '')
                : r.imageUrl;
              thumbFailDiag = await diagnoseThumb(probe);
            }
          }
          statusEl.textContent = `추출 중… ${i + 1}/${items.length}`;
        }

        // '확인 필요' 칸은 한눈에 보이게 — 주황 글씨 + 연한 배경.
        for (const addr of needCells) {
          const cell = ws.getCell(addr);
          cell.font = { color: { argb: 'FFB45309' }, italic: true };
          cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF7ED' } };
        }
        // '정보 없음'은 회색 — 눈에 띄게 할 이유가 없다. 손볼 수 있는 칸이 아니다.
        for (const addr of noInfoCells) {
          const cell = ws.getCell(addr);
          cell.font = { color: { argb: 'FF9CA3AF' }, italic: true };
        }
        ws.autoFilter = { from: 'A1', to: lastCol + '1' };
        ws.views = [{ state: 'frozen', ySplit: 1 }];

        const buf = await workbook.xlsx.writeBuffer();
        downloadBlob(
          new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }),
          `miro_links_${stamp()}.xlsx`,
        );
        statusEl.innerHTML = needCells.length
          ? `완료 · 총 <b>${items.length}</b> · 확인 필요 <b>${needCells.length}</b>칸` +
            (noInfoCells.length ? ` · 사이트 미표기 ${noInfoCells.length}칸` : '')
          : `완료 · 총 <b>${items.length}</b> · 빠진 항목 없음` +
            (noInfoCells.length ? ` (사이트 미표기 ${noInfoCells.length}칸 제외)` : '');
        if (thumbFailDiag) {
          summaryEl.style.display = 'block';
          summaryEl.innerHTML =
            `<div style="padding:8px;background:#fff4f4;border-radius:6px">` +
            `<b>⚠ 썸네일 실패 원인</b><br>${escapeHtml(thumbFailDiag)}</div>`;
        }
      }

      // 썸네일(미로 프록시) 실패 시, 그 URL을 직접 조회해 사람이 읽을 원인으로 변환.
      async function diagnoseThumb(url) {
        let status = 0, body = '';
        try {
          const resp = await fetch(url);
          status = resp.status;
          try { body = (await resp.text()).slice(0, 300); } catch (e) {}
        } catch (e) {
          return `이미지 서버에 연결하지 못했습니다 (${(e && e.message) || e}).`;
        }
        const b = (body || '').toLowerCase();
        if (status === 200) return `이미지 응답은 정상(200)인데 엑셀 삽입에 실패했습니다. 형식 문제일 수 있어요: ${escapeHtml(body).slice(0,120)}`;
        if (b.includes('miro_token')) return `Worker에 미로 토큰(MIRO_TOKEN)이 없습니다. worker 폴더에서 "wrangler secret put MIRO_TOKEN" 후 "wrangler deploy" 하세요.`;
        if (status === 401 && b.includes('unauthorized')) return `접근 토큰(ACCESS_TOKEN) 불일치입니다. ⚙︎ 설정의 Access token 값을 Worker와 동일하게 맞추세요.`;
        if (b.includes('miro item 401') || b.includes('miro item 403')) return `미로 토큰이 만료/무효입니다(${status}). 미로 앱의 "Install app and get OAuth token"에서 토큰을 새로 받아 MIRO_TOKEN을 다시 넣고 재배포하세요.`;
        if (b.includes('miro item 404')) return `미로가 이 이미지를 찾지 못했습니다(404). 앱 권한(boards:read)과 토큰이 이 보드가 속한 팀의 것인지 확인하세요.`;
        if (b.includes('miro imageurl missing')) return `미로 응답에 이미지 주소가 없습니다. 앱 권한(boards:read)을 확인하세요.`;
        if (status === 502) return `이 브랜드 이미지 서버가 외부 요청을 차단합니다(502). 썸네일만 비고 나머지 정보는 정상입니다.`;
        return `이미지 프록시 응답 ${status}: ${escapeHtml(body).slice(0, 160) || '(본문 없음)'}`;
      }

      // 사이트 이동 아이콘(external-link) SVG
      const GO_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 13.5V18a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4.5"/></svg>';

      // ── 스캔 결과 렌더: 2열 편집형 카드(이미지 + 하단 블러 캡션 + 사이트 아이콘) ──
      function renderPreview() {
        tbody.innerHTML = '';
        const q = (cardFilter || '').trim().toLowerCase();
        const meta = (r) => ({
          brand: (r.brand || (r.link ? brandFromUrl(r.link) : '') || '').trim(),
          name: (r.name || r.title || '').trim(),
        });
        const list = rows.filter(r => {
          if (!(r.link || '').trim()) return false;   // 링크 없는 이미지는 리스트에서 제외
          if (!q) return true;
          const m = meta(r);
          return m.brand.toLowerCase().includes(q) || m.name.toLowerCase().includes(q);
        });

        list.slice(0, 80).forEach(r => {
          const { brand, name } = meta(r);

          const card = document.createElement('div');
          card.className = 'pcard';

          const imgWrap = document.createElement('div');
          imgWrap.className = 'pcard-img';
          if (r.imageUrl) {
            const im = document.createElement('img');
            im.src = r.imageUrl; im.alt = ''; im.loading = 'lazy';
            im.onerror = () => { imgWrap.classList.add('noimg'); im.remove(); };
            imgWrap.appendChild(im);
          } else {
            imgWrap.classList.add('noimg');
          }
          card.appendChild(imgWrap);

          // 하단 블러 캡션: 브랜드 + 제품명 (+ 링크 있으면 우측 사이트 아이콘)
          const cap = document.createElement('div');
          cap.className = 'pcard-cap';
          const txt = document.createElement('div');
          txt.className = 'pcard-cap-txt';
          const bEl = document.createElement('div');
          bEl.className = 'cap-brand'; bEl.textContent = brand;
          const nEl = document.createElement('div');
          nEl.className = 'cap-name'; nEl.textContent = name || '(제목 없음)';
          txt.appendChild(bEl); txt.appendChild(nEl);
          cap.appendChild(txt);

          if (r.link) {
            const go = document.createElement('a');
            go.className = 'pcard-cap-go';
            go.href = r.link; go.target = '_blank'; go.rel = 'noopener';
            go.title = r.link; go.setAttribute('aria-label', '사이트로 이동');
            go.innerHTML = GO_SVG;
            go.addEventListener('click', (e) => e.stopPropagation());
            cap.appendChild(go);
          }
          card.appendChild(cap);

          if (r.link) {
            card.classList.add('link');
            card.addEventListener('click', () => window.open(r.link, '_blank', 'noopener'));
          }
          tbody.appendChild(card);
        });

        if (list.length > 80) {
          const more = document.createElement('div');
          more.className = 'pcard-more';
          more.textContent = `…외 ${list.length - 80}개는 엑셀 파일에서 확인`;
          tbody.appendChild(more);
        }
        if (!list.length && q) {
          const none = document.createElement('div');
          none.className = 'pcard-more';
          none.textContent = `"${cardFilter}" 검색 결과 없음`;
          tbody.appendChild(none);
        }
        table.style.display = (list.length || q) ? 'grid' : 'none';
      }



      async function runPool(items, size, fn) {
        let i = 0;
        const n = Math.min(size, items.length);
        const workers = new Array(n).fill(0).map(async () => {
          while (i < items.length) {
            const idx = i++;
            await fn(items[idx]);
          }
        });
        await Promise.all(workers);
      }
    }

    // 미로 보드 이미지의 실제 파일은 Web SDK로 노출되지 않고 REST API로만 받을 수 있습니다.
    // 그래서 (보드ID, 아이템ID)를 Worker에 넘겨 프록시로 받아옵니다. Worker가 서버에 저장된
    // 미로 토큰(MIRO_TOKEN)으로 이미지를 인증해 가져와 CORS 허용 헤더로 돌려줍니다.
    function miroThumbUrl(itemId) {
      if (!__proxy.url || !__boardId || !itemId) return '';
      const base = __proxy.url.replace(/\/+$/, '');
      return base +
        '?board=' + encodeURIComponent(__boardId) +
        '&item=' + encodeURIComponent(itemId) +
        (__proxy.token ? '&token=' + encodeURIComponent(__proxy.token) : '');
    }

    // 이미지 주소 → 다운스케일 PNG(base64).
    // 직접 fetch가 CORS로 막히면 Worker 프록시(?img=)로 자동 재시도 → 엑셀에 이미지가 실제로 들어감.
    async function toPng(url, maxSize) {
      // ① 직접(호스트가 CORS를 주면 성공) → ② Worker 프록시 → ③ Render 프록시(다른 IP)
      try {
        return await fetchToPng(url, maxSize);
      } catch (e) {
        if (/[?&]img=|\/api\/image/.test(url)) throw e;   // 이미 프록시 주소면 재귀 금지
        if (__proxy.url) {
          try {
            const p = __proxy.url.replace(/\/+$/, '') + '?img=' + encodeURIComponent(url) +
              (__proxy.token ? '&token=' + encodeURIComponent(__proxy.token) : '');
            return await fetchToPng(p, maxSize);
          } catch (e2) {}
        }
        if (__render) {
          const r = __render.replace(/\/+$/, '') + '/api/image?url=' + encodeURIComponent(url);
          return await fetchToPng(r, maxSize);
        }
        throw e;
      }
    }

    async function fetchToPng(url, maxSize) {
      const resp = await fetch(url, { mode: 'cors' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const blob = await resp.blob();
      const objUrl = URL.createObjectURL(blob);
      try {
        const img = await loadImage(objUrl); // blob: URL이라 canvas 오염 없음
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        return { base64: canvas.toDataURL('image/png').split(',')[1], w, h };
      } finally {
        URL.revokeObjectURL(objUrl);
      }
    }

    function loadImage(src) {
      return new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im);
        im.onerror = () => rej(new Error('이미지 로드 실패'));
        im.src = src;
      });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function stamp() { return new Date().toISOString().slice(0, 10); }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // URL 도메인 → 브랜드명. 알려진 몰은 예쁜 이름으로, 그 외는 도메인 라벨을 대문자로.
    function brandFromUrl(url) {
      if (!url) return '';
      let host = '';
      try { host = new URL(url).hostname; }
      catch (e) {
        const m = String(url).match(/^(?:https?:\/\/)?([^/]+)/i);
        host = m ? m[1] : '';
      }
      host = host.replace(/^(www\d*|shop|store|kr|en|m)\./i, '').toLowerCase();
      const parts = host.split('.');
      // 복합 TLD(co.kr·co.uk·com.au 등)면 브랜드는 뒤에서 세 번째 조각.
      // (예: lululemon.co.kr → "lululemon", 예전엔 "co"가 잘못 나왔음)
      const twoPartTld = /^(co|com|net|org|ac|or|go)\.(kr|uk|jp|au|nz|in|id|th|il|za|br|mx|ar|tr|tw|hk|sg|my|ph|vn|cn)$/;
      const isTwoPart = parts.length >= 3 && twoPartTld.test(parts.slice(-2).join('.'));
      const base = parts.slice(isTwoPart ? -3 : -2).join('.');
      const known = {
        'hm.com': 'H&M',
        'etam.com': 'Etam',
        'eberjey.com': 'Eberjey',
        'gap.com': 'Gap',
        'intimissimi.com': 'Intimissimi',
        'negativeunderwear.com': 'Negative Underwear',
        'marksandspencer.com': 'M&S',
        'nextdirect.com': 'Next',
        'ae.com': 'American Eagle',
        'mango.com': 'Mango',
      };
      if (known[base]) return known[base];
      const label = parts.length >= 2 ? parts[parts.length - (isTwoPart ? 3 : 2)] : (parts[0] || '');
      return label ? label.charAt(0).toUpperCase() + label.slice(1) : host;
    }
